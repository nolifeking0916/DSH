# Bundle patch: insert the auto-inject host plugin into the profile tree.
- insert:
    - id: memos-autoinject
      name: '@local/memos-autoinject'
      config:
        enabled: true
        apiBase: https://memos.memtensor.cn/api/openmem/v1
        userId: HR
        apiKeyEnv: MEMOS_API_KEY
        apiKey: mpg-hBClucRHzmRk7ML2Y9Qa148iZjAdl94JMsWH9QAR
        # 服务端相关性阈值（0 表示不过滤）；实测强相关问题约 0.60，故取 0.45。
        relativity: 0.45
        # 本地二次过滤；0 表示信任服务端阈值。
        minScore: 0
        maxItems: 4
        maxChars: 600
        timeoutMs: 1200
        injectStep: 1
        # 召回的记忆种类：事实 + 偏好（不传默认就是这两类，显式更可控）。
        memoryView:
          - detail_factual
          - preference
        preferenceLimit: 3
        # 服务端过滤：留空即不限定来源；需要按项目隔离时填 {"agent_id": "..."} 等。
        filter: null
        # 是否把会话 id 作为 conversation_id 传给服务端（提升同会话连续性）。
        useConversationId: true
        # 调试日志（排查用；确认稳定后可置空）。
        debugLog: /tmp/memos-autoinject.log

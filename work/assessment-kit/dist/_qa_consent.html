<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云上文旅集团核心人才系列测试</title>
<style>
/* ================================================================
   tokens.css · 设计令牌（成品唯一变量来源）
   契约：work/assessment-kit/BUILD_CONTRACT.md §2
   ---------------------------------------------------------------
   硬约束 1 · 本文件只放变量：全文只有 :root 变量块，不出现任何组件选择器。
   硬约束 2 · 两个对比度坑必须避开（下面逐条写死）：
     坑 1 · 金色 #C9A55C 在浅底（--paper #FAF9F4 / --sheet #FFFDF8）上只有
           2.21:1 —— 连大字的 3:1 门槛都不到。因此金色【不得】用作浅底上的
           任何文字（含 ≥24px 大字），只允许：
             (a) 装饰线（分隔线 / 竖条 / 进度条填充）；
             (b) 深绿底（--green #1E4634）上的字（4.55:1 ✓）；
             (c) 深绿底上的图形填充（4.55:1 ✓）。
           浅底上的小字一律用 --sand #6E5B36（6.20:1 ✓）。
     坑 2 · --muted 不得用 #77867D（只有 3.6:1，达不到正文 4.5:1），
           固定 --muted #5C6A60（5.41:1 ✓）。
   硬约束 3 · 阈值：正文 / 次级文字 ≥ 4.5:1；大字号（≥18pt、14pt bold、
           CJK 等效 ≥24px）≥ 3:1；图形与控件边界 ≥ 3:1；焦点指示器与其相邻
           底色 ≥ 3:1（浅底用 --focus，深底用 --focus-dark）。
   依据：work/assessment-kit/research/无障碍与打印归档基线_20261024.md
   ---------------------------------------------------------------
   扩展令牌（契约 §2 清单之外，为成品专用组件补齐；均已核对对比度）
   ================================================================ */

:root{
  /* ---- 契约 §2 · 基色（字段名与取值照契约，不改） ---- */
  --green:#1E4634;        /* 深绿：主色 / 深底 */
  --green2:#2A5C42;       /* 次级绿 */
  --gold:#C9A55C;         /* 金：仅装饰线 / 深绿底上的字与图形（浅底禁用） */
  --cream:#F5F0E4;        /* 米白：深底上的文字 / 浅块底 */
  --paper:#FAF9F4;        /* 纸白：面板底 */
  --ink:#1D2A23;          /* 正文 */
  --ink2:#42544B;         /* 次级文字 */
  --muted:#5C6A60;        /* 弱化文字（禁用 #77867D） */
  --line:#E6EAE7;         /* 分隔线（装饰） */
  --sand:#6E5B36;         /* 浅底上的小字 / 棕金系强调 */
  --red:#8E2F26;          /* 错误 / 待提升 */
  --red-bg:#FBEDEA;
  --good:#1B7A56;         /* 正向 / 优秀 */
  --good-bg:#E5F1EB;
  --sheet:#FFFDF8;        /* 卡片纸面 */
  --page:#EDE8DD;         /* 页面底 */
  --paper-b:#EFF1EF;      /* 浅灰绿块底 */

  /* ---- 契约 §2 · 字号 ---- */
  --fs-1:12px; --fs-2:13px; --fs-3:14px; --fs-4:15px; --fs-5:16px; --fs-6:19px; --fs-7:22px;

  /* ---- 契约 §2 · 间距 ---- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;

  /* ---- 契约 §2 · 圆角与触控 ---- */
  --r-s:8px; --r-m:12px; --r-l:18px; --tap:44px;

  /* ---- 契约 §2 · 字体 ---- */
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
}

/* ----------------------------------------------------------------
   扩展令牌：以下为成品专用组件（报告页 / 图表）补齐的变量，
   契约 §2 清单之外的增量，不改动上面的基色。
   ---------------------------------------------------------------- */
:root{
  /* 纸感暖调细线（装饰用，不承载信息） */
  --line-warm:#E0D9C8;

  /* 纯白（卡片 / 输入框 / 按钮面；契约 §2 清单未列，verify_product.py 的对比度检查会用到） */
  --white:#FFFFFF;

  /* 3:1 硬线：控件边界 / 图表网格线（浅底上文字与图形必须 3:1 时用它） */
  --line-2:#74817A;        /* 4.00:1 on --sheet / 3.86:1 on --page（控件边界 ≥3:1，含最深的 --page 底） */

  /* 焦点指示器 */
  --focus:#1E4634;         /* 浅底上 10.06:1 */
  --focus-dark:#C9A55C;    /* 深绿底上 4.55:1 */

  /* 图表 */
  --chart-grid:#74817A;    /* 雷达网格 / 轴线 4.11:1 on 白底 */
  --chart-area:rgba(30,70,52,.14);
  --bar-edge:#74817A;      /* 表现条轨道边界 4.11:1 on 白卡 */
  --bar-fill:#1E4634;      /* 表现条填充 */

  /* 五级色标（顶尖 / 优秀 / 良好 / 合格 / 待提升）
     颜色 + 文字双编码：色只做辅助，级别名必须同时出现；
     每档文字对其自身底色 ≥ 4.5:1，色值同时用作边框（≥3:1）。 */
  --lv-t-bg:#1E4634; --lv-t-fg:#F5F0E4;   /* 顶尖  9.32:1 */
  --lv-a-bg:#E5F1EB; --lv-a-fg:#1B7A56;   /* 优秀  4.57:1 */
  --lv-b-bg:#EFF1EF; --lv-b-fg:#2A5C42;   /* 良好  6.83:1 */
  --lv-c-bg:#F4EEE0; --lv-c-fg:#6E5B36;   /* 合格  5.65:1 */
  --lv-d-bg:#FBEDEA; --lv-d-fg:#8E2F26;   /* 待提升 7.12:1 */

  /* 浅棕底（原型 :root 里已有，成品沿用） */
  --sand-bg:#F4EEE0;
}

/* ================================================================
   components.css · 组件库
   契约：work/assessment-kit/BUILD_CONTRACT.md §2
   视觉基准：work/assessment-kit/prototypes/candidate-flow-prototype.html
             （A 变体「纸感编辑式」为准；吸收 B 变体的 .tasklist 与 .topbar 眉题）
   排除：原型专用的 .qtabs / .switcher / .proto-badge 不进成品。
   ---------------------------------------------------------------
   给 lead 的调用约定
   · 颜色只从 tokens.css 变量取，本文件不写死十六进制。
   · 焦点：基线里已给 3px 描边（浅底 --focus / 深底 --focus-dark，≥3:1）。
   · 触控：可点目标 min-height ≥ 44px（--tap）。
   · 对比度：正文 ≥ 4.5:1；控件边界与承载信息的图形 ≥ 3:1。
   · 打印：@media print 内不依赖「深底 + 浅字」，UA 丢背景时仍可读。
   · 本文件只管组件，长度/位置/分栏交给 layout.css（后加载，冲突以它为准）。
   ================================================================ */

/* ================================================================
   1. 基线（reset / 页面底 / 焦点）
   ================================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);
  font-family:var(--font);font-size:var(--fs-4);line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,p,ul,ol,figure,blockquote{margin:0;padding:0}
ul,ol{list-style:none}
img,svg{max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;text-align:left}
a{color:var(--green)}

/* 焦点指示器：浅底用深绿（10.06:1），深底用金（4.55:1），均 ≥3:1 */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.btn-primary:focus-visible,.topbar :focus-visible,.grade[data-level="T"] :focus-visible{
  outline-color:var(--focus-dark)}

/* ================================================================
   2. 容器与纸面
   ================================================================ */
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 18px}
.sheet{background:var(--sheet);border:1px solid var(--line-warm);border-radius:6px;margin-top:18px;
  padding:30px 26px 26px;box-shadow:0 1px 0 rgba(30,70,52,.05)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-l)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:var(--sp-4);margin-bottom:var(--sp-3)}
.panel h3{font-size:var(--fs-2);color:var(--muted);font-weight:600;margin-bottom:10px;letter-spacing:.04em}

/* 品牌区 */
.brand{text-align:center;margin-bottom:var(--sp-5)}
.brand h1{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.02em;line-height:1.45}
.brand .rule{width:44px;height:2px;background:var(--gold);margin:14px auto 0}   /* 金 = 装饰线 */
.brand .sub{font-size:var(--fs-1);color:var(--muted);margin-top:var(--sp-3);letter-spacing:.06em}

/* 段标题 */
.sect-title{font-family:var(--serif);font-size:var(--fs-4);font-weight:600;color:var(--green);
  padding-bottom:8px;border-bottom:1px solid var(--line-warm);margin:var(--sp-5) 0 var(--sp-3)}

/* 键值行 */
.kv{display:flex;gap:var(--sp-3);padding:9px 0;border-bottom:1px dotted var(--line-warm);font-size:14.5px}
.kv i{font-style:normal;color:var(--muted);flex:0 0 84px;font-size:var(--fs-2)}
.kv b{font-weight:600}

/* 三项模块清单（首页「本次包含」） */
.modlist li{display:flex;gap:var(--sp-3);align-items:baseline;padding:13px 0;
  border-bottom:1px solid #EFE9DC;font-size:14.5px}
.modlist li:last-child{border-bottom:none}
.modlist .no{font-family:var(--serif);color:var(--sand);font-size:var(--fs-4);flex:0 0 22px}
.modlist .t{flex:1;min-width:0}
.modlist .t em{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:3px}
.modlist .c{flex:0 0 auto;color:var(--ink2);font-size:var(--fs-2)}

/* 任务清单（吸收 B 变体：首页「本次任务」总览） */
.tasklist li{display:flex;align-items:center;gap:var(--sp-3);padding:13px 0;border-bottom:1px solid var(--line)}
.tasklist li:last-child{border-bottom:none}
.tasklist .mk{width:32px;height:32px;border-radius:var(--r-s);background:var(--good-bg);color:var(--good);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-2);font-weight:800;flex:0 0 auto}
.tasklist .tt{flex:1;min-width:0;font-size:14.5px}
.tasklist .tt em{display:block;font-style:normal;color:var(--muted);font-size:var(--fs-1);margin-top:2px}
.tasklist .pc{font-size:var(--fs-2);color:var(--ink2);text-align:right;white-space:nowrap}

/* 顶部细眉题条（吸收 B 变体 .topbar；sticky，滚动时保留模块名 + 进度 + 计时） */
.topbar{position:sticky;top:0;z-index:50;background:var(--green);color:var(--cream)}
.topbar .wrap{padding-top:10px;padding-bottom:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--fs-2)}
.toprow b{font-size:var(--fs-4);font-weight:600}
.toprow span{font-variant-numeric:tabular-nums;opacity:.92}
.topbar .pbar{height:4px;background:rgba(255,255,255,.55);border-radius:2px;margin-top:9px}
.topbar .pbar i{display:block;height:100%;background:var(--gold);border-radius:2px}  /* 金在深绿底 4.55:1 ✓ */

/* ================================================================
   3. 按钮 / 表单 / 提示
   ================================================================ */
.btn{min-height:var(--tap);padding:0 20px;border-radius:var(--r-m);font-size:15.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--green);color:#fff}
.btn-ghost{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn-quiet{background:transparent;color:var(--ink2);border:1px solid var(--line-2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn-full{width:100%}

.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:var(--fs-2);color:var(--ink2);margin-bottom:6px}
.field input{width:100%;min-height:var(--tap);padding:10px 13px;border:1px solid var(--line-2);
  border-radius:var(--r-m);background:#fff;font-size:16px}
.field input:focus-visible{border-color:var(--green2);outline:2px solid var(--green2);outline-offset:1px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:6px}
.hint a{color:var(--green)}

/* 胶囊规则（票 #27 定的硬规则，改胶囊样式时照这条）：
   **横向内边距必须 ≥ 圆角半径**（radius = 高的一半）。否则 2 个汉字会落进圆弧区，
   视觉上「卡边」——等级胶囊（.grade-pill）就是这样被发现的。
   .tag：min-height 24 → 半径 12 → 内边距 ≥ 12（取 13）。 */
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 13px;border-radius:999px;
  font-size:11.5px;font-weight:700;line-height:1.4}
.t-good{background:var(--good-bg);color:var(--good)}
.t-sand{background:var(--sand-bg);color:var(--sand)}

.terms p{font-size:13.5px;line-height:1.85;color:var(--ink2);margin-bottom:9px}
.terms p b{color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;min-height:var(--tap);padding:10px 12px;
  border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--paper);font-size:13.5px;line-height:1.7}
.check input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--green)}

.warn{font-size:var(--fs-2);color:var(--red);background:var(--red-bg);border-radius:var(--r-s);
  padding:9px 12px;margin-top:var(--sp-3)}

/* 页脚（两行合规声明） */
.foot{margin-top:26px;padding:14px 0 28px;text-align:center;font-size:11.5px;line-height:1.9;
  color:var(--muted);border-top:1px solid var(--line)}
.foot b{display:block;font-weight:600}

/* ================================================================
   4. 答题页
   ================================================================ */
.qbar{height:3px;background:var(--line-warm);border-radius:2px;margin:0 0 22px}
.qbar i{display:block;height:100%;background:var(--green);border-radius:2px}

/* 细眉题：模块名 + 进度 + 计时 */
.qmeta{display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;
  font-size:var(--fs-1);color:var(--muted);margin-bottom:var(--sp-3)}
.qmeta>span{min-width:0;overflow-wrap:anywhere}
.qmeta .qm-mod{color:var(--ink2);font-weight:600;letter-spacing:.04em}
.qmeta .qm-right{font-variant-numeric:tabular-nums}

.qstem{font-family:var(--serif);font-size:20px;line-height:1.7;margin-bottom:22px;color:var(--ink)}
.opts{display:grid;gap:var(--sp-3)}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;min-height:64px;padding:15px 16px;
  background:#fff;border:1px solid var(--line-warm);border-radius:var(--r-m);font-size:var(--fs-5);line-height:1.6}
/* .opt 卡面沿用原型的浅暖描边（1.41:1，纸感必需）；控件本身由高对比文字识别，
   按 WCAG 2.2 1.4.11 Understanding「控件已有足够对比的文字可识别时不必额外画边界」处理。
   承载状态与边界的描边用 ≥3:1：.k 徽标 --line-2（3.45:1）、选中态 --green（10.6:1）。 */
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink2);
  font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--green);background:#F4F7F4;box-shadow:inset 3px 0 0 var(--green)}
.opt[aria-pressed="true"] .k{background:var(--green);border-color:var(--green);color:#fff}

.qnav{display:flex;gap:10px;margin-top:var(--sp-5)}
.qnav .btn{flex:1}

/* 7 点量表：每格 ≥44×44px（窄屏靠 --sp 收紧与 sheet 内边距适配） */
.scale{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:3px;align-items:end}
.scale .seg{min-height:56px;padding:8px 2px;border-radius:var(--r-s);background:#F6F5F1;border:1px solid var(--line-2);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.scale .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);background:#fff}
.scale .sl{font-size:10.5px;line-height:1.25;color:var(--muted);text-align:center}
.scale .seg[aria-pressed="true"]{border-color:var(--green);background:#EFF5F1}
.scale .seg[aria-pressed="true"] .dot{border-color:var(--green);background:var(--green)}
@media (max-width:460px){
  .scale{gap:1px}
  .sheet{padding-left:16px;padding-right:16px}
}

/* 题号抽屉 */
.gridbtn{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;min-height:var(--tap);
  border:1px dashed var(--line-2);border-radius:var(--r-s);color:var(--ink2);font-size:var(--fs-3);background:#fff}
.mask{position:fixed;inset:0;background:rgba(20,32,26,.45);z-index:70;display:none}
.mask.on{display:block}
.gridpanel{position:fixed;left:0;right:0;bottom:0;z-index:71;background:#fff;border-radius:18px 18px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto;display:none}
.gridpanel.on{display:block}
.gridpanel h4{font-size:var(--fs-3);margin-bottom:12px}
.gridpanel .g{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:6px}
.gridpanel .g b{display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;
  border-radius:7px;background:#F0F2F0;color:var(--ink2);font-size:12.5px;font-weight:600}
.gridpanel .g b.done{background:var(--good-bg);color:var(--good)}
.gridpanel .g b.cur{outline:2px solid var(--green);outline-offset:1px}
@media (min-width:520px){
  .gridpanel .g{grid-template-columns:repeat(8,minmax(44px,1fr))}
}

/* ================================================================
   5. 报告页专用组件（成品新增，契约 §2 追加项）
   ---------------------------------------------------------------
   5.1 五级色标 .grade / .grade-pill
       DOM：<span class="grade-pill" data-level="A">优秀</span>
       data-level ∈ T / A / B / C / D（= 逻辑数据的五档 key）。
       颜色 + 文字双编码：级别名必须写进元素里，颜色只是辅助；
       黑白打印时名字仍在，含义不丢。
   5.2 .grade-meter（可选，五段强度条：顶尖5 / 优秀4 / 良好3 / 合格2 / 待提升1）
       DOM：<span class="grade-meter"><i></i><i></i><i></i><i></i><i></i></span>
       段数即等级 → 与颜色无关的第二重编码，打印/色觉差异下都能读。
   ================================================================ */
/* 胶囊规则（票 #27）：横向内边距必须 ≥ 圆角半径（= 高的一半），文字才完全落在直段。
   min-height 26 → 半径 13 → 内边距 ≥ 13（取 15，留 2px 余量）。原来的 10px < 13，
   2 个汉字落进圆弧区 → 「合格 / 良好」的等级圈看着卡边。 */
.grade-pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 15px;border-radius:999px;
  font-size:var(--fs-2);font-weight:700;line-height:1.4;white-space:nowrap;border:1px solid transparent}
.grade-pill[data-level="T"]{background:var(--lv-t-bg);color:var(--lv-t-fg);border-color:var(--lv-t-bg)}
.grade-pill[data-level="A"]{background:var(--lv-a-bg);color:var(--lv-a-fg);border-color:var(--lv-a-fg)}
.grade-pill[data-level="B"]{background:var(--lv-b-bg);color:var(--lv-b-fg);border-color:var(--lv-b-fg)}
.grade-pill[data-level="C"]{background:var(--lv-c-bg);color:var(--lv-c-fg);border-color:var(--lv-c-fg)}
.grade-pill[data-level="D"]{background:var(--lv-d-bg);color:var(--lv-d-fg);border-color:var(--lv-d-fg)}

/* ================================================================
   5.1b 五级梯 .ladder（票 #39 新增）
   ---------------------------------------------------------------
   要素搬自 prototypes/candidate-report-20261025.html 的 .ladder
   （该原型已标「定位作废」，只有「口径说明块」与「五级梯」两个要素进成品）。
   DOM：<div class="ladder"><span class="on">顶尖</span><span class="on">优秀</span>
        <span class="on">良好</span><span class="on cur">合格</span><span>待提升</span></div>
   · 五格从高到低：顶尖 / 优秀 / 良好 / 合格 / 待提升；
   · 深绿格 = 已达到的档（on），当前档再加一道金线（cur），浅灰格 = 未达到；
   · **档名是主编码**（文字写在格子里），底色只是辅助 —— 黑白打印与色觉差异下都读得出；
   · 金只作装饰描边（tokens.css 坑 1：浅底上不用金做文字）；
   · 打印时深绿格改白底深字（见 §6 @media print），不依赖「深底 + 浅字」。
   ================================================================ */
.ladder{display:flex;gap:4px;margin-top:var(--sp-3)}
.ladder span{flex:1;text-align:center;font-size:var(--fs-1);line-height:1.4;padding:5px 2px;
  border-radius:var(--r-s);background:var(--paper-b);color:var(--ink2);border:1px solid var(--line)}
.ladder span.on{background:var(--green);color:var(--cream);border-color:var(--green)}
.ladder span.cur{outline:2px solid var(--gold);outline-offset:1px}
.ladder-cap{font-size:var(--fs-1);color:var(--muted);margin-top:var(--sp-2)}

/* ================================================================
   5.1c 口径说明块 .calib（票 #39 新增）
   ---------------------------------------------------------------
   要素搬自 prototypes/candidate-report-20261025.html 的 .calib。
   DOM：<p class="calib"><b>口径说明</b>：…</p>
   · 金底棕字的提示块：告诉施测人「这套档位是绝对锚点定的，尚未经真人样本校准」
     （票 #26 §12 的硬要求：校准前必须标注）；
   · 文字用 --sand（浅底 5.65:1 ✓），不用 --gold（浅底只有 2.21:1，tokens.css 坑 1）。
   ================================================================ */
.calib{margin:var(--sp-4) 0 var(--sp-3);font-size:var(--fs-1);line-height:1.8;color:var(--sand);
  background:var(--sand-bg);border:1px solid var(--line-warm);border-radius:var(--r-s);padding:8px 12px}
.calib b{color:var(--sand);font-weight:700}

.grade{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r-m);
  border:1px solid transparent;min-width:132px}
.grade-name{font-family:var(--serif);font-size:var(--fs-5);font-weight:600;line-height:1.4}
.grade-score{font-size:var(--fs-1);color:inherit;font-variant-numeric:tabular-nums}
.grade[data-level="T"]{background:var(--lv-t-bg);color:var(--lv-t-fg);border-color:var(--lv-t-bg)}
.grade[data-level="A"]{background:var(--lv-a-bg);color:var(--lv-a-fg);border-color:var(--lv-a-fg)}
.grade[data-level="B"]{background:var(--lv-b-bg);color:var(--lv-b-fg);border-color:var(--lv-b-fg)}
.grade[data-level="C"]{background:var(--lv-c-bg);color:var(--lv-c-fg);border-color:var(--lv-c-fg)}
.grade[data-level="D"]{background:var(--lv-d-bg);color:var(--lv-d-fg);border-color:var(--lv-d-fg)}
.grade[data-level="T"] .grade-score{color:var(--cream)}

.grade-meter{display:inline-flex;gap:3px;align-items:center}
.grade-meter i{width:9px;height:9px;border:1px solid currentColor;opacity:.32}
.grade-meter i.on{opacity:1;background:currentColor}
.grade[data-level="T"] .grade-meter i{opacity:1;background:currentColor}
.grade[data-level="A"] .grade-meter i:nth-child(-n+4){opacity:1;background:currentColor}
.grade[data-level="B"] .grade-meter i:nth-child(-n+3){opacity:1;background:currentColor}
.grade[data-level="C"] .grade-meter i:nth-child(-n+2){opacity:1;background:currentColor}
.grade[data-level="D"] .grade-meter i:nth-child(1){opacity:1;background:currentColor}

/* 5.3 维度成绩行：维度名 + 分数 + 五级胶囊
       DOM：<div class="metric-row"><span class="mr-name">演绎推理</span>
             <span class="mr-score">T 55</span>
             <span class="grade-pill" data-level="A">优秀</span></div> */
.metric-row{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--tap);
  padding:8px 0;border-bottom:1px dotted var(--line-warm)}
.metric-row:last-child{border-bottom:none}
.metric-row .mr-name{flex:1;min-width:0;font-size:var(--fs-4);line-height:1.5}
.metric-row .mr-score{flex:0 0 auto;font-family:var(--serif);font-size:var(--fs-5);
  font-variant-numeric:tabular-nums;color:var(--ink)}
.metric-row .grade-pill{flex:0 0 auto}

/* 5.4 维度相对表现条：长度是主编码，颜色只是辅助
       DOM：<div class="bar"><span class="bar-label">相对表现</span>
             <span class="bar-track"><span class="bar-fill" style="width:78%"></span></span>
             </div>
       .bar-fill 的 width 由 JS 按维度相对表现写入（0–100）。
       票 #27：**右端的 .bar-value 已去掉** —— 同一维度的分数已经在上面的
       .metric-row 里写过一次，条形再写一遍就成了「18/24 出现两次」。 */
.bars{display:grid;gap:10px;margin:var(--sp-3) 0}
.bar{display:grid;grid-template-columns:minmax(68px,96px) 1fr auto;gap:var(--sp-3);
  align-items:center;min-height:32px}
.bar-label{font-size:var(--fs-2);color:var(--ink2);overflow-wrap:anywhere}
.bar-track{height:12px;background:#EDEFEC;border:1px solid var(--bar-edge);border-radius:999px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--bar-fill);border-radius:999px;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.30) 0 3px,transparent 3px 8px)}
.bar-value{font-size:var(--fs-2);color:var(--ink2);font-variant-numeric:tabular-nums;
  min-width:3.4em;text-align:right}

/* 5.5 雷达图容器
       DOM：<div class="radar-wrap"><svg class="radar" viewBox="0 0 420 420" width="420" height="420" …>
                <g class="radar-grid">…</g><polygon class="radar-area" …/>
                <text class="radar-label">演绎推理</text><text class="radar-value">T 55</text>
              </svg></div>
       形状 + 文字标注双重表达：顶点旁必须同时有维度名与数值。 */
.radar-wrap{width:100%;max-width:420px;margin:0 auto;break-inside:avoid}
.radar{display:block;width:100%;height:auto}
.radar-grid line,.radar-grid polygon{fill:none;stroke:var(--chart-grid);stroke-width:1}
.radar-axis{stroke:var(--chart-grid);stroke-width:1}
.radar-area{fill:var(--chart-area);stroke:var(--green);stroke-width:2;stroke-linejoin:round}
.radar-point{fill:var(--green)}
.radar-label{font-size:12px;fill:var(--ink2)}
.radar-value{font-size:11px;fill:var(--muted)}

/* 5.6 短板提示块（左侧金色竖条；金色在浅底只有 2.21:1 → 只作装饰线，
       块的身份由「短板」标题文字承担，不靠颜色单独传达） */
.short-board{border:1px solid var(--line-warm);border-left:4px solid var(--gold);
  border-radius:0 var(--r-s) var(--r-s) 0;padding:12px 14px;margin:var(--sp-4) 0;background:var(--sheet)}
.short-board .sb-title{display:block;font-family:var(--serif);font-size:var(--fs-3);font-weight:600;
  color:var(--green);margin-bottom:4px}
.short-board .sb-text{font-size:var(--fs-2);line-height:1.8;color:var(--ink2)}
.short-board .sb-text b{color:var(--ink)}

/* 5.7 综合评估块（总报告顶部）
       DOM：<section class="compose"><h3 class="compose-title">综合评估</h3>
             <div class="compose-head"><span class="grade" data-level="B">…</span></div>
             <p class="compose-note">…</p>
             <p class="compose-note compose-flag">…</p></section> */
.compose{background:var(--cream);border:1px solid var(--line-warm);border-left:4px solid var(--gold);
  border-radius:var(--r-m);padding:18px 20px;margin:var(--sp-4) 0;break-inside:avoid}
.compose-title{font-family:var(--serif);font-size:var(--fs-5);font-weight:600;color:var(--green);margin-bottom:12px}
.compose-head{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:10px}
.compose-note{font-size:var(--fs-2);line-height:1.8;color:var(--ink2)}
.compose-note + .compose-note{margin-top:6px}
.compose-flag{border-left:3px solid var(--sand);padding-left:10px;color:var(--sand);font-weight:600}

/* 5.8 三项并列成绩表
       DOM：<div class="list-metrics"><div class="metric">
               <div class="metric-name">第一项 · 管理行为成熟度</div>
               <div class="metric-value"><span class="grade-pill" data-level="B">良好</span></div>
               <div class="metric-note">短板 · 关注重点</div></div> … </div> */
.list-metrics{display:grid;grid-template-columns:1fr;gap:var(--sp-3);margin:var(--sp-4) 0}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.metric-name{font-size:var(--fs-2);color:var(--ink2);line-height:1.6;margin-bottom:8px}
.metric-value{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.metric-note{font-size:var(--fs-1);color:var(--muted);line-height:1.7}
.metric-note b{color:var(--ink2)}
@media (min-width:640px){
  .list-metrics{grid-template-columns:repeat(3,1fr)}
}

/* ================================================================
   6. 打印
   · 只用 break-inside / break-before 这类跨浏览器可用的分页属性；
     @page 只写 margin / size（由 layout.css 负责），页码不靠 margin box
     （Firefox / Safari 不支持）。
   · 不依赖「深底 + 浅字」传达信息：深底色块在打印时改为白底深字。
   ================================================================ */
@media print{
  body{background:#fff}
  .mask,.gridpanel,.btn,.gridbtn,.qnav,.topbar{display:none !important}
  .compose,.short-board,.metric-row,.list-metrics,.metric,.grade,.grade-pill,.radar-wrap,
  .card,.panel,.foot,.ladder,.calib{break-inside:avoid}
  .compose,.short-board,.grade,.grade-pill,.radar-wrap,.list-metrics,.calib{
    print-color-adjust:exact;-webkit-print-color-adjust:exact}
  /* 深绿底浅字的档位块在丢背景后不可读 → 打印改为白底深字 + 深色描边 */
  .grade-pill[data-level="T"],.grade[data-level="T"]{
    background:transparent;color:var(--green);border:2px solid var(--green)}
  .grade[data-level="T"] .grade-score{color:var(--green)}
  /* 五级梯（票 #39）：深绿格同样改成白底深字；当前档靠加粗 + 粗描边标出，不靠金色 */
  .ladder span.on{background:transparent;color:var(--green);border-color:var(--green)}
  .ladder span.cur{outline:none;border:2px solid var(--green);font-weight:700}
  .short-board,.compose{border-left-width:4px}
  /* SVG 打印需要确定的内在尺寸（viewBox 之外的 width/height 用绝对单位） */
  .radar-wrap{width:120mm;max-width:120mm}
  .radar{width:120mm;height:120mm}
}

/* 布局层：页面骨架与六个屏的结构（颜色/字号/圆角一律走 tokens.css，组件走 components.css） */

html,body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.65;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 var(--sp-4)}

/* 答题区（顶栏由 components.css 的 .topbar 提供，这里只管内容区与滚动留白） */
.qbody{padding-bottom:var(--sp-6);scroll-padding-top:76px}

/* 告知卡 */
.consent h2{font-family:var(--serif);font-size:var(--fs-6);margin-bottom:var(--sp-1)}

/* 完成页 */
.done-seal{width:70px;height:70px;border-radius:50%;border:2px solid var(--green);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto var(--sp-4)}

/* 施测人入口 */
.hr-entry .lock{font-size:var(--fs-2);color:var(--muted);line-height:1.8}

/* 报告页骨架 */
.rep-nav{display:flex;gap:var(--sp-2);overflow-x:auto;padding:var(--sp-3) 0;-webkit-overflow-scrolling:touch}
/* 胶囊规则（票 #27）：横向内边距必须 ≥ 圆角半径（= 高的一半）。
   min-height 40 → 半径 20 → 内边距 ≥ 20（取 22）。原来的 12px 让「总报告」这类
   3 字标签落进圆弧区。导航是横向可滚的（overflow-x:auto），加宽不破版。 */
.rep-nav button{flex:0 0 auto;min-height:40px;padding:0 22px;border-radius:999px;background:#F0F2F0;color:var(--ink2);font-size:var(--fs-2);white-space:nowrap}
.rep-nav button[aria-current="true"]{background:var(--green);color:var(--cream);font-weight:600}
.rep-block{margin-bottom:var(--sp-5)}
.rep-block h3{font-family:var(--serif);font-size:var(--fs-4);margin-bottom:var(--sp-2);color:var(--green)}
.rep-block .note{font-size:var(--fs-2);color:var(--muted);line-height:1.85}
.dims{display:grid;gap:var(--sp-1)}
.wrong-list{font-size:var(--fs-2);color:var(--ink2);line-height:1.9}
.wrong-list li{margin-bottom:var(--sp-2)}
.must{font-size:var(--fs-2);color:var(--ink2);line-height:1.85}
.must li{margin-bottom:var(--sp-1)}
.print-only{display:none}

/* 打印 */
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .print-only{display:block}
  /* 只对小构件用 break-inside:avoid；整块 rep-block 可能高于一页，硬套会留下空白页 */
  .compose,.short-board,.grade,.list-metrics .metric,.metric-row,.bar,.panel,.card{break-inside:avoid;page-break-inside:avoid}
  .must li,.wrong-list li{break-inside:avoid;page-break-inside:avoid;orphans:2;widows:2}
  .rep-block h3{break-after:avoid;page-break-after:avoid}
  .keep{break-inside:avoid;page-break-inside:avoid}
  body{padding-bottom:20px}   /* 给固定页脚留位置，避免压住最后一行 */
  p{orphans:2;widows:2}
  .wrap{max-width:100%;padding:0}
}
/* 页码：@page margin box 只有 Chrome ≥131 / Edge 支持（Firefox、Safari 忽略 → 自动降级为区块编号） */
@page{
  size:A4;               /* 集团用纸为 A4；如需 Letter 改这一行即可 */
  margin:12mm 12mm 16mm; /* 底部留出页脚带 */
  @bottom-right{content:"第 " counter(page) " 页";font-size:10px;color:#5C6A60}
  /* 每页合规提醒（票 #27：打印门断言「每页合规声明在场」）。
     走 @page margin box —— 这是唯一既能每页重复、又不压住正文的机制；
     **不要**用 position:fixed（固定元素在打印时会把正文压掉，见票 #5 实测）。
     降级：Firefox / Safari 忽略 margin box → 那两页仍由报告末尾的 .foot
     给出完整两行合规声明（口径与 src/data/copy.js 的 foot 一致）。 */
  @bottom-left{content:"心理测评结果不得作为录用唯一依据";font-size:9px;color:#5C6A60}
}
/* 打印页脚：position:fixed 在打印时每页重复，跨浏览器都能读到候选人身份信息 */
/* 打印页脚：固定元素在打印时每页重复；bottom 放到负值 → 落在页边距区，不压正文 */
.print-end{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:14px}

/* 报告分区：屏幕一次只显示一个；打印时四个区块全部输出，每块另起一页 */
.rep-sec{display:none}
.rep-sec.on{display:block}
.print-head{font-size:var(--fs-1);color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}

@media print{
  .rep-sec{display:block!important;break-before:page;page-break-before:always}
  .rep-sec:first-child{break-before:auto;page-break-before:auto}
  .print-head{display:block!important}
  .rep-nav{display:none!important}
}

</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-mask" id="mask"></div>
<div class="gridpanel" id="gridpanel" role="dialog" aria-label="题号面板">
  <h4 id="grid-title">题号</h4>
  <div class="g" id="grid"></div>
  <button class="btn btn-quiet btn-full" style="margin-top:14px" onclick="APP.closeGrid()">关闭</button>
</div>
<script>
/* 成品的固定文案（口径来源：告知卡要素与数据留存规则清单 §2；措辞不得擅自改写） */
window.__COPY__ = {
  foot: [
    "浙江云上文旅集团 · 集团行政人事部 ｜ 本页为纯本地单文件网页，作答内容不上传服务器",

  ],

     「不上传服务器」那句只属于离线版 —— 云上版说它就是撒谎，所以两套分开写。 */
  footCloud: [

    "心理测评结果不得作为录用唯一依据；本测试不构成医学或心理诊断"
  ],
  /* {FIRST} = 第一项测评名称与题量（运行时从题库 meta 取） */
  terms: [
    ["一、这套测评是什么。",
     "本系列包含三项：{FIRST}、第二项情境测试（16 道自我参照 + 60 道情境判断）、第三项推理测试（40 题）。它们分别看你在常规工作方式上的倾向、在具体管理情境中的反应方式、以及面对陌生问题的推理与判断。它不测量性格，不测量智力，不属于临床心理评估，也不对你的心理健康状况作出任何判断。"],
    ["二、谁能看到结果。",

<script>
window.__DATA__ = {"brand":"云上文旅集团核心人才系列测试","m1":{"meta":{"version":"1.0","title":"管理行为成熟度测评","scoring":"每题给「更有效的一端」记 1 分；每维 0-24 分；不合成总档（ADR-0010），只给四维各档 + 短板维","bands":{"顶尖":[22,24],"优秀":[18,21],"良好":[14,17],"合格":[9,13],"待提升":[0,8]},"dimensions":[{"key":"INT","name":"互动方式","definition":"测量一个人在工作中与他人互动的能量方向与方式——是主动把关系与协作推出去，还是先把事情理清再与人连接。","theory":"荣格的外向/内向（E/I）维度 + 自我决定理论中的关系需求 + 行为锚定等级（anchored rating）方法。","behavior":"在管理岗位上，能主动建立工作联系、把信息与协作推出去的一端更有效；把信息和决定闷在自己这里、等人来问的一端更容易拖慢协作。判据落在「先连接再推进」还是「先理清再等人」的工作顺序上，而不是讨不讨人喜欢。","items":24},{"key":"SNT","name":"关注重点","definition":"测量一个人处理信息时的优先落点——是先抓可核验的事实与细节，还是先抓整体趋势与可能性。","theory":"荣格的实感—直觉维度 + 系统思维中「事实层—模式层—意义层」的层次区分。","behavior":"在景区经营这类要落地、要能对账的管理场景里，先把事实与细节核清楚的一端更有效；只谈趋势与可能性、不落到可核验事实的一端容易做出兑现不了的判断；判据落在「先核事实、再谈趋势」的工作顺序上，而非细节永远比趋势重要。","items":24},{"key":"TFS","name":"行事依据","definition":"测量一个人做判断与处理分歧时，依据先行还是人先行——是按讲清的道理与事先约定的标准，还是先照顾具体的人与关系。","theory":"荣格的思维/情感（T/F）维度 + 目标定向理论（绩效规范 vs 人际支持规范）+ 程序公平理论（一致性、可预期性）。","behavior":"在规则明确、需一致执行的管理场景里，先把依据与标准讲清楚、再处理具体人情的一端更有效；因人而异、因关系改判断的一端在协作与交接上成本更高。注意：不要写成\"不顾人情\"，要落在\"先讲依据、再谈处境\"这个工作顺序上。","items":24},{"key":"JPS","name":"行事节奏","definition":"测量一个人安排与推进任务的节奏——是先定顺序、按时收口，还是按当下状态随时调整。","theory":"荣格的判断/知觉（J/P）维度 + 计划与执行分离 + 时间盒与任务闭环 + 情境领导（低不确定性场景用计划型节奏）。","behavior":"在景区运营这类多任务、强节拍、要对外交结果的场景里，先排顺序、按时收口的一端更有效；想到哪做到哪、一直开着的状态更易漏事。判定落在“先定顺序、留出弹性、按时收口”的工作顺序上，不等同于死板。","items":24}]},"items":[{"id":"INT-01","dim":"INT","a":"遇到跨部门卡点我会主动约人对齐","b":"遇到跨部门卡点我会等对方来找","anchor":"a","rationale":"跨部门卡点只能靠当面拉齐推动，主动约人对齐能省掉反复转达的等待。","theory":"弱连接理论指出跨部门协作多依赖非正式连接；外向者从外部互动中获取能量。"},{"id":"INT-02","dim":"INT","a":"节庆活动排期我会等市场先出方案","b":"节庆活动排期我会拉市场一起定","anchor":"b","rationale":"节庆排期牵动多部门，先一起定能让方案一次对齐、少一轮返工。","theory":"共同调节表明群体决策依赖过程中的实时共享，而不是各自成稿后再合并。"},{"id":"INT-03","dim":"INT","a":"大客流预警我会马上通知各岗位","b":"大客流预警我会等例会再说","anchor":"a","rationale":"预警的价值在于抢时间，越早通知各岗位越能提前布控。","theory":"及时性是应急指挥链的前提，晚一步的信息在处置上等于没有信息。"},{"id":"INT-04","dim":"INT","a":"一线反馈的问题我会先记下等周会","b":"一线反馈的问题我会当天找对应部门对接","anchor":"b","rationale":"一线问题当天进到责任部门，才不会在小问题里拖成事故。","theory":"问题解决研究给出前二十四小时的黄金窗口，及时转出信息即缩短协作链路。"},{"id":"INT-05","dim":"INT","a":"渠道结款有争议我会主动约时间谈","b":"渠道结款有争议我会等财务通知","anchor":"a","rationale":"结款分歧越早当面谈，越容易在证据还热的时候谈拢条件。","theory":"互惠与社会交换机制下，面对面协商比单向催问更容易达成一致。"},{"id":"INT-06","dim":"INT","a":"巡检发现的问题我会自己盯着整改","b":"巡检发现的问题我会当场通知责任人","anchor":"b","rationale":"当场把问题交到责任人手上，整改才会真正闭环。","theory":"角色责任机制要求问题落到具体责任主体，否则责任会在流程中稀释。"},{"id":"INT-07","dim":"INT","a":"合作景区来对接我会主动约见面","b":"合作景区来对接我会等文件发来","anchor":"a","rationale":"跨机构合作靠见面推进，文件往来的效率远低于当面把条件谈清。","theory":"资源依赖理论中，联盟的稳定性来自直接的面对面谈判与明确承诺。"},{"id":"INT-08","dim":"INT","a":"新项目筹备我会先写完方案再沟通","b":"新项目筹备我会边写方案边找人对齐","anchor":"b","rationale":"边写边对齐能让分歧在方案成型前暴露，避免完工后大改。","theory":"认知损耗研究提示，推迟暴露的假设会在后期放大返工成本。"},{"id":"INT-09","dim":"INT","a":"导游排班有冲突我会马上协调处理","b":"导游排班有冲突我会等排班结果","anchor":"a","rationale":"排班冲突越早当面协调，越能在各方各自安排之前定下来。","theory":"被动等待会让冲突下沉到一线执行端，由接待现场为沟通延时买单。"},{"id":"INT-10","dim":"INT","a":"讲解词有争议我会等通知再表态","b":"讲解词有争议我会找讲解员一起改","anchor":"b","rationale":"讲解词争议拉着讲解员一起改，改出来的版本才真讲得出口。","theory":"分布式认知表明一线经验是方案的一部分，脱离实践者的共识难以落地。"},{"id":"INT-11","dim":"INT","a":"客流数据异常我会主动找运营核对","b":"客流数据异常我会等月度报表","anchor":"a","rationale":"数据异常当场核对能定位到具体动作，等报表就只剩一个解释不了的数。","theory":"单一事实来源要求异常在发生时归因，事后归因的难度与代价都高得多。"},{"id":"INT-12","dim":"INT","a":"供应商催款我会等核完账再回复","b":"供应商催款我会当天就回过去说明","anchor":"b","rationale":"当天回一句话就能稳住合作方，拖着不回反而把正常流程变成纠纷。","theory":"期望理论中，及时回应是对合作方行为的正向强化，能减少信任损耗。"},{"id":"INT-13","dim":"INT","a":"新人上岗前我会主动带他走一遍流程","b":"新人上岗前我会等他自己来问","anchor":"a","rationale":"上岗前带走一遍流程，比事后补教省下的是游客接待的容错成本。","theory":"社会学习理论指出观察与示范是技能习得的快路径，等人问则拖成被动纠错。"},{"id":"INT-14","dim":"INT","a":"媒体采访需求我会等宣传部门统一口径","b":"媒体采访需求我会主动回电确认口径","anchor":"b","rationale":"对外发声前主动回电确认，既拿到统一口径，也不至于让采访空等。","theory":"情境危机传播理论强调对外沟通的及时与一致，二者都靠主动回访衔接。"},{"id":"INT-15","dim":"INT","a":"年度计划讨论我会先找各部门收意见","b":"年度计划讨论我会自己拟完再上会","anchor":"a","rationale":"先收意见再拟，计划才是各方认得的计划，上会才推得动。","theory":"参与式决策能提升执行承诺度，先拟后问容易变成走过场的宣贯。"},{"id":"INT-16","dim":"INT","a":"节假日投诉多我会自己逐条看完","b":"节假日投诉多我会拉客服一起逐条处理","anchor":"b","rationale":"投诉高峰拉上客服一起逐条处理，既压得住时效，也不漏掉共性问题。","theory":"服务补救理论指出，速度与个性化补救会影响投诉后的满意度与复购意向。"},{"id":"INT-17","dim":"INT","a":"设备故障我会立刻联系维保","b":"设备故障我会先记下等巡检时处理","anchor":"a","rationale":"游玩设备故障越早叫维保，越能在影响扩大前停用处置。","theory":"现场指挥链要求故障信息即时上传，早报告本身就是一种风险控制动作。"},{"id":"INT-18","dim":"INT","a":"领导要的数据我会自己做完再交","b":"领导要的数据我会边做边同步进展","anchor":"b","rationale":"边做边同步让上级随时知道进度与风险，闷头做完只剩一个迟到的结果。","theory":"向上管理的期望理论指出，持续反馈比最终交付更能建立可靠预期。"},{"id":"INT-19","dim":"INT","a":"跨景区联票推进我会等对方先联系","b":"跨景区联票推进我会主动牵线对接","anchor":"b","rationale":"联票这类跨主体合作，先迈出对接那一步的人才能拿到主动权。","theory":"结构洞理论指出，率先连接两个主体的中间人拥有信息与议价优势。"},{"id":"INT-20","dim":"INT","a":"复盘会上有改进点我会当场提出来","b":"复盘会上有改进点我会自己先消化","anchor":"a","rationale":"改进点当场提出来才能在集体层面解决，自己消化往往就没有下文。","theory":"学习型组织要求复盘产生可执行的公开调整，而不是个人化的私下消化。"},{"id":"INT-21","dim":"INT","a":"供应商比价我会等采购给结论","b":"供应商比价我会主动约几家一起谈","anchor":"b","rationale":"比价主动约谈能当场问清条件，压价和排期才有真实依据。","theory":"议价研究显示，亲自进入谈判并横向比较，比接受单一结论更有优势。"},{"id":"INT-22","dim":"INT","a":"讲解服务投诉我会亲自回访游客","b":"讲解服务投诉我会等客服回访结果","anchor":"a","rationale":"讲解投诉亲自回访能拿到真实感受，也更容易把游客留下。","theory":"服务补救中，掌握一手反馈的一方更能把握补救尺度与后续关系。"},{"id":"INT-23","dim":"INT","a":"团队加班排班我会先自己扛下来","b":"团队加班排班我会先问大家能不能调","anchor":"b","rationale":"先问一句能不能调，比自己扛下更省力也更公平，团队更可持续。","theory":"社会支持与互惠规范表明，可协商的任务分担能降低过载与耗竭。"},{"id":"INT-24","dim":"INT","a":"项目收尾我会主动把结果同步相关方","b":"项目收尾我会做完就自己归档","anchor":"a","rationale":"结果同步出去，相关方才能据此安排下一步，归档不通知等于信息中止。","theory":"组织记忆理论指出，经验只有被传递出去，才沉淀为可复用的组织资产。"},{"id":"SNT-01","dim":"SNT","a":"拿到月度经营报表我先核数字来源","b":"拿到月度经营报表我先看整体走向","anchor":"a","rationale":"先核清数字来源，后面的走势判断才经得起对账。","theory":"实感维度关注可验证的事实细节，事实层是模式层推导的前提。"},{"id":"SNT-02","dim":"SNT","a":"客流数据出来我先讲增长前景","b":"客流数据出来我先核各渠道口径","anchor":"b","rationale":"各渠道口径不一致时趋势会失真，先核口径才谈得上增长。","theory":"系统思维区分事实层与模式层，先对事实层才不把口径误差当成趋势。"},{"id":"SNT-03","dim":"SNT","a":"做排班前我逐班核对客流","b":"做排班前我先定大致规律","anchor":"a","rationale":"逐班核过客流，排班才排得出对得上接待能力的班。","theory":"细节事实是资源调度决策的输入，模式推断须建立在逐项数据上。"},{"id":"SNT-04","dim":"SNT","a":"复盘一场活动我先讲传播效果","b":"复盘一场活动我先核每笔费用","anchor":"b","rationale":"每笔费用核清，才知道这场活动到底赚在哪、亏在哪。","theory":"事实层支撑效果判断，脱离细节的效果结论常常兑现不了。"},{"id":"SNT-05","dim":"SNT","a":"渠道对账我先逐笔核对流水","b":"渠道对账我先看整月差额","anchor":"a","rationale":"逐笔流水核过，才能定位是哪一单、哪一环出的差错。","theory":"差错定位依赖细节层证据，整月差额只提示方向不指向原因。"},{"id":"SNT-06","dim":"SNT","a":"新项目测算我先描绘收益前景","b":"新项目测算我先把投入项列清","anchor":"b","rationale":"投入项先列清，收益前景才有可核算的分母。","theory":"先建立事实基线再推演可能性，是系统推演的基本次序。"},{"id":"SNT-07","dim":"SNT","a":"讲解词定稿我先核对史实细节","b":"讲解词定稿我先打磨整体结构","anchor":"a","rationale":"讲解里的史实错一处就会被投诉，先核事实再谈结构。","theory":"事实准确性优先于表达形式，细节错误直接损伤交付物可信度。"},{"id":"SNT-08","dim":"SNT","a":"设备停机我先估算影响范围","b":"设备停机我先逐项检查记录","anchor":"b","rationale":"逐项查过记录，才判断停多久、要停哪几台。","theory":"事实数据先于估算，估算才有可核的修正依据。"},{"id":"SNT-09","dim":"SNT","a":"淡旺季预案我先核实历史数据","b":"淡旺季预案我先设想客流走势","anchor":"a","rationale":"历史数据核实过，预案才谈得上按真实规律准备。","theory":"预测建立在已核事实之上，凭想象设想的预案容易落空。"},{"id":"SNT-10","dim":"SNT","a":"游客意见汇总我先归纳同类问题","b":"游客意见汇总我先逐条读原始反馈","anchor":"b","rationale":"逐条读原始反馈，才知道游客具体在嫌哪一点。","theory":"原始材料属事实层，归类结论须由事实支撑才可靠。"},{"id":"SNT-11","dim":"SNT","a":"招商洽谈我先摸清对方真实需求","b":"招商洽谈我先描绘合作前景","anchor":"a","rationale":"摸清对方真实需求，才谈得上有落地的合作条件。","theory":"先取事实再谈可能，是商务洽谈中的稳妥次序。"},{"id":"SNT-12","dim":"SNT","a":"月度对账我先看差额高低","b":"月度对账我先把每个科目核平","anchor":"b","rationale":"每个科目核平，月度经营结论才谈得上成立。","theory":"对账一致性是财务事实层的基本要求，整体判断须以此为前提。"},{"id":"SNT-13","dim":"SNT","a":"写经营分析我先把数据来源标清","b":"写经营分析我先提炼结论观点","anchor":"a","rationale":"来源标清的分析才经得起别人复核和追问。","theory":"可追溯性是分析结论可被信任的前提条件。"},{"id":"SNT-14","dim":"SNT","a":"临时加演排期我先估算观众规模","b":"临时加演排期我先核场地与档期","anchor":"b","rationale":"场地与档期核过，场次规模才排得下、兑现得了。","theory":"资源约束属硬事实，先核事实再谈规模更可靠。"},{"id":"SNT-15","dim":"SNT","a":"客流下滑我先逐日查数据波动","b":"客流下滑我先找整体原因","anchor":"a","rationale":"逐日波动看清了，才找得到真正下滑的原因。","theory":"局部事实先于整体归因，否则容易下错判断。"},{"id":"SNT-16","dim":"SNT","a":"做年度预算我先定增长目标","b":"做年度预算我先核历史支出项","anchor":"b","rationale":"历史支出核过，增长目标才落在真实基线之上。","theory":"事实基线先于目标设定，否则目标缺少可核算的依据。"},{"id":"SNT-17","dim":"SNT","a":"培训新导游我先核对讲解要点","b":"培训新导游我先设计课程框架","anchor":"a","rationale":"讲解要点先核对，新人上岗才不会讲错关键内容。","theory":"内容准确性属事实层要求，是导游交付质量的底线。"},{"id":"SNT-18","dim":"SNT","a":"投诉上升我先谈服务趋势","b":"投诉上升我先看具体时段","anchor":"b","rationale":"具体时段看清了，才知道投诉集中在哪个环节。","theory":"事实定位先于趋势判断，才能落到可整改的具体环节。"},{"id":"SNT-19","dim":"SNT","a":"宣传稿发布前我先核事实表述","b":"宣传稿发布前我先求传播效果","anchor":"a","rationale":"事实表述核过，宣传口径才经得起媒体与游客追问。","theory":"对外表述的事实准确性是底线要求，效果预期属后一步。"},{"id":"SNT-20","dim":"SNT","a":"采购比价我先看整体价位高低","b":"采购比价我先逐项核对报价单","anchor":"b","rationale":"逐项核对报价单，比出来的价才真正可比。","theory":"同口径可比才构成有效比较，笼统价位缺少对账基础。"},{"id":"SNT-21","dim":"SNT","a":"谈新线路合作我先核实对方资质","b":"谈新线路合作我先谈分成前景","anchor":"a","rationale":"对方资质核实过，线路合作的收益预期才有底。","theory":"尽调事实是合作可行性的前提，收益前景属推演层面。"},{"id":"SNT-22","dim":"SNT","a":"演出流程我先通盘设计节奏","b":"演出流程我先核对每项细节","anchor":"b","rationale":"每项细节核对过，现场执行才不会在环节上出错。","theory":"现场交付依赖细节事实，整体节奏设计属统筹层面。"},{"id":"SNT-23","dim":"SNT","a":"员工建议汇总我先还原具体诉求","b":"员工建议汇总我先归纳整体倾向","anchor":"a","rationale":"具体诉求还原了，管理层才知道该改哪一处。","theory":"事实材料先于归纳，才能把意见落到可执行动作。"},{"id":"SNT-24","dim":"SNT","a":"年度复盘我先描绘来年方向","b":"年度复盘我先把关键数字锁定","anchor":"b","rationale":"关键数字锁定，来年方向才有可靠的对照基线。","theory":"事实层是模式层与意义层的前提，先锁数据再定方向。"},{"id":"TFS-01","dim":"TFS","a":"有人违反制度时我通常先讲清条款标准","b":"有人违反制度时我通常按人情轻重处理","anchor":"a","rationale":"先讲清条款和标准，团队才知道边界在哪，处理结果才有一致性。","theory":"程序公平理论强调规则一致与可预期性，人情优先会让标准失去约束力。"},{"id":"TFS-02","dim":"TFS","a":"游客投诉时我通常先照顾对方感受","b":"游客投诉时我通常先确认标准与责任","anchor":"b","rationale":"投诉先界定标准与责任，后续答复和整改才有统一口径，不因人而异。","theory":"目标定向理论要求绩效规范优先于关系维护，口径统一才能保证服务质量稳定。"},{"id":"TFS-03","dim":"TFS","a":"排班出现冲突时我通常照顾个别人","b":"排班出现冲突时我通常按班表规则排","anchor":"b","rationale":"排班按既定班表来定，班组交接和人力安排才可预期，随意调整把成本推给下一班。","theory":"程序公平理论中的可预期性可降低交接成本，例外越多协作越易失序。"},{"id":"TFS-04","dim":"TFS","a":"绩效打分有争议时我通常先核对评分标准","b":"绩效打分有争议时我常先安抚当事人","anchor":"a","rationale":"评分争议回到标准核对才有说服力，先安抚情绪会把标准让位于关系。","theory":"目标定向理论区分绩效规范与人际支持规范，绩效判断须锚定可衡量标准。"},{"id":"TFS-05","dim":"TFS","a":"任务分配时我通常按岗位分工来分","b":"任务分配时我通常看谁跟我更熟","anchor":"a","rationale":"按岗位分工派活，权责清晰、进度可追；凭熟悉度派活最容易积累隐性成本。","theory":"角色理论强调权责对等与角色清晰，人际熟悉度不构成任务分配的依据。"},{"id":"TFS-06","dim":"TFS","a":"费用审批超标准时我通常按制度退回","b":"费用审批超标准时我通常先替对方争取","anchor":"a","rationale":"超标准事项退回是让预算口径生效，替对方争取等于让个人判断替代制度。","theory":"制度刚性与预算控制依赖一致执行，个案通融会累积例外先例。"},{"id":"TFS-07","dim":"TFS","a":"大客流排队拥堵时我通常按分流方案引导","b":"大客流排队拥堵时我通常先安抚对方情绪","anchor":"a","rationale":"大客流拥堵先按分流方案引导才能快速疏导，先安抚情绪会让队伍继续积压。","theory":"角色规范要求现场处置按预案与职责边界，减少临场的随意决策。"},{"id":"TFS-08","dim":"TFS","a":"商户提额外条件时我通常先看关系深浅","b":"商户提额外条件时我通常按合同条款回复","anchor":"b","rationale":"合同条款是合作双方的稳定预期，按条款回复才能维持长期合作的可信度。","theory":"程序公平理论关注规则一致，答复随关系变化会制造不确定预期。"},{"id":"TFS-09","dim":"TFS","a":"跨部门交接时我通常先讲清责任和标准","b":"跨部门交接时我通常先维系对方关系","anchor":"a","rationale":"先讲清责任与标准，交接才有可执行的依据，维系关系不能替代职责界定。","theory":"组织协作依赖明确的权责接口，程序一致比人际亲疏更能降低协作损耗。"},{"id":"TFS-10","dim":"TFS","a":"值班交接时我通常先安抚接班同事","b":"值班交接时我通常按记录逐项核对","anchor":"b","rationale":"交接按记录逐项核对才能责任清晰，遗漏项才不会在下一班暴露。","theory":"程序公平理论中的留痕与一致性，使交接责任可追溯、争议有据可查。"},{"id":"TFS-11","dim":"TFS","a":"物资领用超标时我通常按定额讲清楚","b":"物资领用超标时我通常先照顾熟手需求","anchor":"a","rationale":"按定额讲清楚才守得住物资口径，按人情松紧会让定额形同虚设。","theory":"标准化运营要求资源分配依既定额度执行，身份不应成为额度变量。"},{"id":"TFS-12","dim":"TFS","a":"游客退改票时我通常先看对方情绪","b":"游客退改票时我通常按票务规则处理","anchor":"b","rationale":"退改票按规则处理才能给游客稳定预期，情绪优先易造成同类问题不同口径。","theory":"程序公平理论强调一致性执行，服务标准的统一来自规则先于个体感受。"},{"id":"TFS-13","dim":"TFS","a":"评优公示前我通常先平衡人情","b":"评优公示前我通常先讲清评分口径","anchor":"b","rationale":"公示前讲清评分口径才经得起对照，先平衡人情会让结果难以服众。","theory":"目标定向理论中绩效规范需先于人际支持规范，公平感来自口径透明一致。"},{"id":"TFS-14","dim":"TFS","a":"请假加班审批时我通常按制度核对工时","b":"请假加班审批时我通常先照顾员工难处","anchor":"a","rationale":"考勤与加班按制度核对才可核算，先顾难处会让工时口径失真。","theory":"制度的一致执行是后续核算与考核的基础，个案照顾会破坏数据可信度。"},{"id":"TFS-15","dim":"TFS","a":"巡检发现隐患时我通常按标准要求整改","b":"巡检发现隐患时我通常先跟当事人商量","anchor":"a","rationale":"隐患按标准整改才能真正消除，先跟人商量容易让整改被拖延。","theory":"风险控制要求问题按标准闭环，责任归属只影响整改时限而非是否整改。"},{"id":"TFS-16","dim":"TFS","a":"培训考核未通过时我通常先安抚被考人","b":"培训考核未通过时我通常按要求安排补训","anchor":"b","rationale":"考核未通过按要求补训才形成闭环，安抚代替补训会让能力差距被掩盖。","theory":"目标定向理论强调绩效改进须落实为后续行动，情绪照顾不产生能力增益。"},{"id":"TFS-17","dim":"TFS","a":"供应商比选时我通常按既定评分办法","b":"供应商比选时我通常先看关系远近","anchor":"a","rationale":"比选按既定评分办法才能保证结果可解释、可复盘，关系远近不是评判依据。","theory":"程序公平理论要求标准事前公开并一致适用，才能获得外部合作方信任。"},{"id":"TFS-18","dim":"TFS","a":"服务责任有争议时我通常先护着自己人","b":"服务责任有争议时我通常按记录判定","anchor":"b","rationale":"责任争议按留痕记录判定才站得住，先护人会让记录失去约束力。","theory":"程序正义要求依据可追溯的事实裁定，责任认定靠证据而非立场。"},{"id":"TFS-19","dim":"TFS","a":"工作交接时我通常先看对方能否接受","b":"工作交接时我通常先说清标准和遗留事项","anchor":"b","rationale":"交接先说清标准与遗留事项才能接得住，先迁就对方接受度会留下隐患。","theory":"交接成本取决于信息完整性，程序化交接优于围绕人际感受的安排。"},{"id":"TFS-20","dim":"TFS","a":"文件用印申请时我通常按权限逐级审批","b":"文件用印申请时我通常先找熟人通融","anchor":"a","rationale":"用印按权限逐级审批才守得住授权边界，熟人通融等于让关系替代授权。","theory":"授权管理依赖权限与责任一致，越级变通会瓦解内控与审计留痕。"},{"id":"TFS-21","dim":"TFS","a":"节庆增援排人时我通常按负荷标准分配","b":"节庆增援排人时我通常先叫熟人来帮忙","anchor":"a","rationale":"增援按负荷标准分配才能保障峰值服务，叫熟人来帮忙容易顾此失彼。","theory":"目标定向理论下绩效保障优先于关系调用，负荷与能力才是排人依据。"},{"id":"TFS-22","dim":"TFS","a":"合同结算有扣款时我通常先保合作关系","b":"合同结算有扣款时我通常按条款执行","anchor":"b","rationale":"扣款按条款执行才形成商业信用，先保关系会让履约约束逐渐失效。","theory":"合同履约依赖条款的一致适用，个案让步会改变合作方的行为预期。"},{"id":"TFS-23","dim":"TFS","a":"员工申诉复核时我通常先看对方态度","b":"员工申诉复核时我通常按制度重新核查","anchor":"b","rationale":"申诉复核按制度重新核查才能给出公正结论，先看态度会带入主观情绪。","theory":"组织公平要求申诉处理依既定程序，主观态度不应进入裁定依据。"},{"id":"TFS-24","dim":"TFS","a":"跨团队借人支援时我通常先答应关系近的","b":"跨团队借人支援时我通常按需求优先级排","anchor":"b","rationale":"借人按需求优先级排队才不误事，先答应关系近的会让支援资源失衡。","theory":"资源调度依事前规则更有效率也更公平，人际远近不应改变资源顺序。"},{"id":"JPS-01","dim":"JPS","a":"任务一下涌进来我通常先排好先后","b":"任务一下涌进来我通常谁催先做谁","anchor":"a","rationale":"多任务同时涌来时先排先后，才能保证对外交付不被临时催办带偏。","theory":"计划与执行分离：先排序再动手，把判断与执行拆开，减少来回切换。"},{"id":"JPS-02","dim":"JPS","a":"每天开工前我通常直接上手头的事","b":"每天开工前我通常先过一遍当天事项","anchor":"b","rationale":"开工前先过一遍当天事项，重要但不紧急的事才有机会留在计划里。","theory":"时间盒与任务闭环：每天设固定的规划动作，把待办从想法推到可执行状态。"},{"id":"JPS-03","dim":"JPS","a":"每天收工前我会逐项核对是否收口","b":"每天收工前我通常把事留到第二天","anchor":"a","rationale":"收工前逐项核对，才能当天发现仍未收口的事项并处理掉。","theory":"任务闭环与缺口显性化：检查环节把漏项暴露在当天，而不是拖成积压。"},{"id":"JPS-04","dim":"JPS","a":"临时插入的事我通常先丢下手上的","b":"临时插入的事我会并进已有的顺序","anchor":"b","rationale":"临时插入也排进既有顺序，团队节奏才不会被一件事整体打散。","theory":"计划型节奏：低不确定性场景下，插入事项需要落点，而不是每次重排全局。"},{"id":"JPS-05","dim":"JPS","a":"给下面派活我会写清先做什么后做什么","b":"给下面派活我通常口头交代个大概","anchor":"a","rationale":"派活写清先后，下面才知道先动哪一件、什么时候交回结果。","theory":"情境领导：任务明确度决定执行速度，顺序信息是成本最低的指令。"},{"id":"JPS-06","dim":"JPS","a":"对外的进展我通常等人来问才汇报","b":"对外的进展我会按约定节点主动报","anchor":"b","rationale":"按约定节点主动报进展，协作方不必反复追问就能安排后续。","theory":"沟通节拍：把同步做成固定节点，信息成本前置在可控范围。"},{"id":"JPS-07","dim":"JPS","a":"推进一件事我会限定一段时就收口","b":"推进一件事我通常不设时限一直做","anchor":"a","rationale":"给每件事限定时段并收口，能防止要紧事项被无限期往后拖。","theory":"时间盒：任务设边界提高完成率，开放式任务最容易一直挂着。"},{"id":"JPS-08","dim":"JPS","a":"开会前我通常到了现场再商量议题","b":"开会前我会先定好要谈的几件事","anchor":"b","rationale":"会前定好议题，会议才谈得出结果，不然时间用完事情还没落地。","theory":"结构化会议：议程先行把讨论收敛到决策，减少无效时长消耗。"},{"id":"JPS-09","dim":"JPS","a":"节假日高峰我通常提前几天排好班","b":"节假日高峰我通常当天再临时调人","anchor":"a","rationale":"高峰前排好班，人手调度有预案，现场才不会被临时变化拖着走。","theory":"预案化排程：高节拍场景下提前排班优于事后补救。"},{"id":"JPS-10","dim":"JPS","a":"跨月的事我通常一直挂着慢慢做","b":"跨月的事我会拆成节点一段段推进","anchor":"b","rationale":"把跨月事项拆成节点，进度看得见，也不会长期挂着没人推。","theory":"里程碑分解：长任务切成可验收节点，才能纳入节拍管理。"},{"id":"JPS-11","dim":"JPS","a":"手上几件事我会随时更新它们的进度","b":"手上几件事我通常不主动更新进度","anchor":"a","rationale":"随时更新进度，自己和上级都看得清哪些在推进、哪些已经卡住。","theory":"可见性管理：进度外显是团队协同与提前介入的前提。"},{"id":"JPS-12","dim":"JPS","a":"没做完的事我通常一直挂在待办里","b":"没做完的事我会定好下次启动时间","anchor":"b","rationale":"为没做完的事定下次启动时间，它就不会一直躺在待办里被忘掉。","theory":"重新进入机制：明确下一步入口的任务，中断后的恢复成本明显更低。"},{"id":"JPS-13","dim":"JPS","a":"突发状况一出现我会先定处置顺序","b":"突发状况一出现我通常先动手再说","anchor":"a","rationale":"突发状况先定处置顺序再动手，团队才不会各自行动互相干扰。","theory":"顺序优先：在可预判的处置范围内先排序，能显著减少返工与互相踩踏。"},{"id":"JPS-14","dim":"JPS","a":"我通常整天的时段都被零碎事占满","b":"我会固定留出一段时段处理要紧事","anchor":"b","rationale":"固定留出处理要紧事的时段，才不会被零碎事务把整天切碎。","theory":"批处理与时间盒：同类事项聚成整块处理，切换损耗更低。"},{"id":"JPS-15","dim":"JPS","a":"和外部约定交付我通常提前备好","b":"和外部约定交付我通常到点才动手","anchor":"a","rationale":"对外交付提前准备，才不会因内部延误影响合作方的后续安排。","theory":"外部承诺管理：由对外节点倒推内部准备，前置缓冲是节拍稳定的基本做法。"},{"id":"JPS-16","dim":"JPS","a":"任务一多我通常都压在自己手上","b":"任务一多我会先分一部分给下面","anchor":"b","rationale":"把可分担的事分出去，管理岗才腾得出手做必须自己收口的事。","theory":"授权与聚焦：管理者的产出取决于能否把执行类事项交出去并盯住节点。"},{"id":"JPS-17","dim":"JPS","a":"日程排满时我会先砍掉次要事项","b":"日程排满时我通常照单全部接下来","anchor":"a","rationale":"日程排满时先砍次要事项，关键任务才有位置也有时间。","theory":"优先级取舍：固定容量下主动放弃低价值项，才谈得上排得下。"},{"id":"JPS-18","dim":"JPS","a":"手上有多少事我通常就接多少","b":"我会明确写下眼下先不做哪些事","anchor":"b","rationale":"写明眼下不做哪些事，等于给团队一个可预期的范围边界。","theory":"反向清单：明确不做什么能减少插单，保持既定节奏不被反复打断。"},{"id":"JPS-19","dim":"JPS","a":"交接工作时我会写明进度和下一步","b":"交接工作时我通常口头交代一下","anchor":"a","rationale":"交接写明进度与下一步，接手的人不必从头问起，事项也不掉链子。","theory":"交接标准化：状态与下一步结构化移交，是跨班次节拍不断线的保证。"},{"id":"JPS-20","dim":"JPS","a":"每日巡查我通常想到去就去一趟","b":"每日巡查我通常安排在固定时段","anchor":"b","rationale":"巡查固定时段，检查不靠临时想起，该发现的问题才不会被漏掉。","theory":"例行化执行：固定时点的例行事项，才可能在忙乱中被稳定完成。"},{"id":"JPS-21","dim":"JPS","a":"重要节点前我会预留一段缓冲","b":"重要节点前我通常把时间排得满满的","anchor":"a","rationale":"重要节点前留一段缓冲，现场出现小意外才有回旋余地。","theory":"缓冲设计：多任务强节拍场景中，无缓冲的排期一旦遇扰就全线延后。"},{"id":"JPS-22","dim":"JPS","a":"我通常一次把很多事同时推开","b":"我通常一次只重点往前推几件","anchor":"b","rationale":"一次只重点推几件事，注意力不被摊薄，收口的质量更高。","theory":"注意力瓶颈与在制品限制：并行推进的事项越多，单项完成率越低。"},{"id":"JPS-23","dim":"JPS","a":"一周开始时我会先把整周排个大概","b":"一周开始时我通常不做整体安排","anchor":"a","rationale":"周初先排个大概，全周事项分布心里有数，临时插入也不打乱节奏。","theory":"滚动规划：周度整体安排为日度执行提供参照，减少反复重排。"},{"id":"JPS-24","dim":"JPS","a":"要做的事我通常只记在脑子里","b":"要做的事我会写成清单逐项划掉","anchor":"b","rationale":"写成清单逐项划掉，完成与未完成都看得见，事项不容易凭空消失。","theory":"外显化与清单驱动：把任务落在可见载体上，才谈得上真正收口。"}]},"eq":{"meta":{"title":"候选人情商在线测试题库（云上文旅集团招聘用）","version":"1.0","sjt_scored":48,"sjt_consistency":12,"self_items":16,"note":"48 道计分题覆盖 8 个维度，每维 6 题、单题满分 2 分、维度满分 12 分，再按维度权重加权；最优行为 2 分，次优可接受 1 分（各选项分值见 note），回避、甩锅、夺责、情绪化施压类 0 分。C01-C06 共 12 题为一致性检查题（每对 2 题，pair 字段标识同一情境的两种问法），score 一律为 0，不计入任何维度分，只用于观察：同对两题都选 A/B（积极型）或都选 C/D（消极型）判为一致，一正一负判为需复核。faking=true 的题用于识别伪装着色，其正确项属公认做法，note 标注不可自证选项。","encoding":"fixed-20261024"},"dimensions":[{"key":"regu","name":"情绪稳定","outer":"A","outer_name":"情绪自控","weight":15},{"key":"conf","name":"冲突处理","outer":"C","outer_name":"冲突与协作","weight":15},{"key":"rela","name":"关系经营","outer":"D","outer_name":"关系与影响","weight":15},{"key":"infl","name":"影响力说服","outer":"D","outer_name":"关系与影响","weight":13},{"key":"empa","name":"同理心","outer":"B","outer_name":"同理沟通","weight":12},{"key":"team","name":"协作补位","outer":"C","outer_name":"冲突与协作","weight":11},{"key":"comm","name":"倾听表达","outer":"B","outer_name":"同理沟通","weight":10},{"key":"self","name":"自我觉察","outer":"A","outer_name":"情绪自控","weight":9}],"self_items":[{"id":"S01","text":"我通常在情绪起来之前，先察觉到自己正在不耐烦。","dimension":"self","reverse":false},{"id":"S02","text":"我通常要等别人先开口，才承认自己情绪已经受了影响。","dimension":"self","reverse":true},{"id":"S03","text":"我通常在别人当面冲我的时候，还能把话按顺序说完。","dimension":"regu","reverse":false},{"id":"S04","text":"我通常一听到质疑就急着解释，忍不住当场把话说重。","dimension":"regu","reverse":true},{"id":"S05","text":"我通常在意见冲突时，先弄清楚双方各自在担心什么。","dimension":"conf","reverse":false},{"id":"S06","text":"我通常遇到分歧就先顺着对方，等事情过去再说。","dimension":"conf","reverse":true},{"id":"S07","text":"我通常记得重要的人上次提过的事，并在下次见面时有所准备。","dimension":"rela","reverse":false},{"id":"S08","text":"我通常只在有事找对方时才联系，平时不做维护。","dimension":"rela","reverse":true},{"id":"S09","text":"我通常在提不同意见时，先把依据和对方能接受的做法准备出来。","dimension":"infl","reverse":false},{"id":"S10","text":"我通常习惯用职级或权威压过去，很少解释理由。","dimension":"infl","reverse":true},{"id":"S11","text":"我通常在对方情绪明显时，先处理情绪，再处理事情。","dimension":"empa","reverse":false},{"id":"S12","text":"我通常在对方不讲道理时，很快就不再沟通。","dimension":"empa","reverse":true},{"id":"S13","text":"我通常会主动看别人手上的活缺什么，自己有余力时补上。","dimension":"team","reverse":false},{"id":"S14","text":"我通常先做完自己分内的活，别人缺人等我被问到再说。","dimension":"team","reverse":true},{"id":"S15","text":"我通常在别人说完之后，会先复述一遍确认自己听懂了。","dimension":"comm","reverse":false},{"id":"S16","text":"我通常话说到一半就怕对方不耐烦，改成只给结论不给过程。","dimension":"comm","reverse":true}],"sjt":[{"id":"Q01","dimension":"regu","stem":"季度复盘会上，分管副总当着三个机构负责人说你们机构的客流数据造假，你手上有检票原始数据和渠道对账单，当场你会怎么做？","opts":["先说这可能有误会，不当场展开，表示会后把材料补齐再汇报","当场把检票数据和渠道对账口径投屏对照，指出差异出在哪个环节","会上先应下来是我这边的问题，会后再找副总说明数据真实情况","强调自己数据没问题，问题出在别的机构报数口径，请副总安排专人核查"],"answer":"B","second":"D","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"3462c7e1"},{"id":"Q02","dimension":"conf","stem":"集团要求景区本季度客流破 120 万，酒店同时被要求收紧房态提价，你判断涨房价会掉客流，领导让你先保客流。","opts":["按集团要求先冲客流，房价与客诉出问题后再和酒店沟通","私下找酒店负责人先谈妥配合，拿到结果后再在复盘会上说明","把两个部门的目标冲突上报，请集团先出一个统一口径","把客流与房价、渠道佣金、客诉量做成一页测算，同步给两个部门"],"answer":"D","second":"B","third":"C","scored":true,"pair":null,"faking":false,"consistency":false,"c":"287f9c17"},{"id":"Q03","dimension":"rela","stem":"一家合作多年的商户今年经营困难，找到你说想减少档期又怕以后不再合作。","opts":["先了解他缺在资金还是人力，一起看降本排期或分档结算的办法","告诉他集团档期是统一的，减不了，建议他申请退出重新招商","答应帮他减一半档期，不走正式流程，剩下的问题以后再补","把他介绍给同行的朋友，让对方接手他剩下的盘子"],"answer":"A","second":"B","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"1b9bd955"},{"id":"Q04","dimension":"self","stem":"连续两晚的客诉都压到你这里，第三天同事又带来一个流程问题，你发现自己的语气比平时冲。","opts":["先把同事的问题处理完，情绪的事等忙完这一阵再说","跟同事说明自己今天状态不好，改天再找他，先把手上的事做完","停一下把问题记下来，先把手上的事交接出十分钟，再回来看是不是自己状态的问题","直接跟同事说我今天有点烦，然后照原样把问题提出来"],"answer":"C","second":"B","third":"D","scored":true,"pair":null,"faking":false,"consistency":false,"c":"14b01688"},{"id":"Q05","dimension":"infl","stem":"你发现现在的招商政策会让优质商户觉得吃亏而退出，你拿着数据去劝分管副总调整。","opts":["强调不改的后果，把可能退出的商户数量放到最前面讲","说清政策漏洞、退出风险和新方案对指标的影响，请副总决定是否调整","找几位已经谈好的商户一起向副总说明他们的顾虑","直接把政策草案发给相关商户征询，把问题公开化"],"answer":"B","second":"A","third":"C","scored":true,"pair":null,"faking":false,"consistency":false,"c":"1a07a655"},{"id":"Q06","dimension":"comm","stem":"领导在会里讲了一段很长的部署，大家都没接话，会后你需要落地。","opts":["按自己的理解先做一版计划，做完再发给领导看","直接问同事领导刚才到底要什么，你们听懂了吗","会后单独找领导确认哪几条是重点、哪些可以灵活，再列出执行计划","在群里复述一遍领导的部署，请大家补充"],"answer":"C","second":"D","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"1e5eef40"},{"id":"Q07","dimension":"empa","stem":"检票口一位母亲因为孩子发烧哭闹，坚持要退两张票，你赶到时队伍已经排起来。","opts":["按规定告诉她开园后不支持退票，她这两张票只能作废","让她到旁边等着，等这一波游客检完再处理她的问题","自己掏钱买两张小额票让她带孩子去医务室，别影响队伍","先把孩子安置到有座位和热水的地方，联系医务，再处理退票的事"],"answer":"D","second":"C","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"52d50cd"},{"id":"Q08","dimension":"team","stem":"开园当天营销同事被临时抽调去支援直播，你这边检票少一个人，队长说让他们自己想办法。","opts":["自己这边加班顶上，把缺口补上，不去麻烦营销那边","主动问营销那边能挪谁、帮哪个环节顶一段，并约定轮换时间","在工作群里说明人手不足，请双方主管协调后给我明确安排","先按现有人手开园，等高峰过去再处理"],"answer":"B","second":"A","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"1ee82d88"},{"id":"Q09","dimension":"regu","stem":"同期开园的兄弟景区在业主群里说你们抢走了他们的团队客源，渠道经理很生气，要你当场给个说法。","opts":["不在群里回应，私下联系对方，把重叠的订单逐单核对后再定怎么处理","请对方把具体是哪几单、哪个日期的团拉出来，再逐单说明归属","回复我们的客源也是自己谈来的，把责任推回给对方","先在群里认下这事我们也有责任，再私下找对方经理核对"],"answer":"A","second":"B","third":null,"scored":true,"pair":null,"faking":true,"consistency":false,"c":"12e9fa90"},{"id":"Q10","dimension":"conf","stem":"你提的民宿商户联营方案在招商会上被三位老商户当场反对，说会拉低他们的生意。","opts":["坚持方案整体不变，说明集团已经审批，反对意见先记录下来","提议先在一家商户试运行三个月，用数据说话再推广","请他们说出具体担心哪一块，当场记录并说明哪些条款能改","宣布方案暂缓，先私下逐个拜访商户了解情况再定是否调整"],"answer":"C","second":"B","third":"D","scored":true,"pair":null,"faking":false,"consistency":false,"c":"f66019b"},{"id":"Q11","dimension":"rela","stem":"集团来了一位重要客户，你提前做过功课，客户随口提到上次来时膝盖不舒服。","opts":["在欢迎词里提一句上次您说过膝盖不舒服，这次特意注意了","把这个细节记下来发给接待同事，让他们到时候留意","照常安排行程，等客户自己提出需求再响应","提前安排低步行路线，把台阶路段换成接驳，车上备好护膝"],"answer":"D","second":"A","third":"B","scored":true,"pair":null,"faking":false,"consistency":false,"c":"2cbde4f3"},{"id":"Q12","dimension":"self","stem":"上个月你负责的供应商招标被审计指出评分标准有疏漏，有人说是评审组集体签的字。","opts":["回到自己的评审记录里逐条看，确认哪一条当初可以发现，写成复盘结论","主动向领导认领这个问题，并提出以后增加一道自查流程","等审计出正式结论，再决定要不要写复盘和说明","说明评审组三个人都签了字，责任不在自己一个人"],"answer":"A","second":"B","third":"C","scored":true,"pair":null,"faking":false,"consistency":false,"c":"14c8da3f"},{"id":"Q13","dimension":"infl","stem":"旺季周末景区限流，一位餐饮老板拒绝暂停接单，说外面排队排到公路上更赚钱。","opts":["告诉他不配合就不给档口，限流期间他的客人也进不来","把限流规则、预计翻台和投诉风险讲清，提出联合导流的分时段方案","给他看去年同期同样限流后的营业额数据，由他自己判断","让景区招商经理去谈，你不出面，避免正面冲突"],"answer":"B","second":"C","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"19357af4"},{"id true,"pair":null,"faking":false,"consistency":false,"c":"aaf9091"},{"id":"Q40","dimension":"team","stem":"你的下属临时请假，明天开园负责检票机调试的岗位空出来，他的工作别人都不熟。","opts":["请工程部今晚派人顶一晚，你自己明天盯着","明天开场前临时找一位同事顶岗，靠口头交代","今晚先把调试步骤整理成一页交给同事，明天到岗再跟半天确认","向值班经理申请减开一个检票通道"],"answer":"C","second":"A","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"5a20d07"},{"id":"Q41","dimension":"regu","stem":"开园前四十分钟，暴雨预警升级，缆车可能停运，票务、退改、客服、车队四个口都在等答复。","opts":["让各口先按自己的理解答复游客，等公司决定后再统一调整","按影响面排序，先定停运判断和退改口径，再让各口按同一口径对外说","先把票务口的事处理完，缆车和退改等其他领导定下来再说","把情况汇总给集团，等回复后再通知各口"],"answer":"B","second":"D","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"cdc9a7d"},{"id":"Q42","dimension":"conf","stem":"客户接待会上，景区说接待标准是按文件执行的，酒店说这个标准从来没收到过版本，两个人当场争起来。","opts":["请客户稍等，私下核实版本发送记录和生效日期，当场约定由谁统一回复","把话题先转到接待安排细节上，标准争议留到会后再说","让酒店先按景区的文件执行，避免在客户面前继续分歧","说这事不归我们管，交给双方领导去谈"],"answer":"A","second":"B","third":null,"scored":true,"pair":null,"faking":true,"consistency":false,"c":"35cc2da0"},{"id":"Q43","dimension":"rela","stem":"集团年会上，主持人把你和另一位负责人并列表扬，但他的成绩被说成了你团队做的。","opts":["会后私下跟主持人提一句，由主持人下次修正","会上马上澄清，把每块工作的归属说清楚，避免以后被当成默认","不提，反正是好事，功劳多一分少一分不重要","会上不打断，会后第一时间单独跟主持人和他本人把归属说明白"],"answer":"D","second":"A","third":"B","scored":true,"pair":null,"faking":true,"consistency":false,"c":"e4500ae"},{"id":"Q44","dimension":"self","stem":"复盘时组长说你带团队的风格偏强势，你第一反应是不太认同。","opts":["说明自己只是要求高，从来没有让谁下不来台","反思自己是不是在用强势保护自己不承担责任","找两三个共事过的人分别问同一个问题，看反馈是不是一致","接受这个评价，但不确定自己要不要改，先放着"],"answer":"C","second":"B","third":null,"scored":true,"pair":null,"faking":false,"consistency":false,"c":"14cc747c"},{"id":"Q45","dimension":"infl","stem":"跨部门会上三方各说各话，时间只剩十分钟还没结论，主持人问你怎么看。","opts":["提议延后再议，把会开到大家有结论为止","把分歧收敛成两个可选方案，说明各自代价，请负责人当场选一个并定责任人","把讨论拉回到目标和数据上，先确认各方一致同意的部分","提出一个折中方案，请大家先按这个执行，有问题下次再调"],"answer":"B","second":"C","third":"D","scored":true,"pair":null,"faking":false,"consistency":false,"c":"247b9a69"},{"id":"Q46","dimension":"comm","stem":"你要在开园仪式上代表团队发言，稿子被同事改过几版，有些句子不像你的说法。","opt

:null,"scored":false,"pair":"C02","faking":false,"consistency":true,"c":"0"},{"id":"C03A","dimension":"conf","stem":"客户接待会上景区和酒店当众争执接待标准，景区说按文件执行，酒店说没收到过版本。你作为牵头的人会怎么做？","opts":["先请双方停下，私下核实版本发送记录和生效日期，再由一个人统一说明","当场把两个版本的差异指出来，说明以哪一版为准，之后由你统一答复","让酒店先按景区的版本执行，自己不再往下追","说双方标准以后再对，今天先按景区这一版走"],"answer":"B","second":null,"third":null,"scored":false,"pair":"C03","faking":false,"consistency":true,"c":"0"},{"id":"C03B","dimension":"conf","stem":"客户接待会上景区和酒店争执接待标准，你注意到客户已经面露不悦。同事说这事儿不归我们管。你会怎么做？","opts":["先请双方停下，私下核实版本发送记录和生效日期，再由一个人统一说明","当场把两个版本的差异指出来，说明以哪一版为准，之后由你统一答复","让酒店先按景区的版本执行，自己不再往下追","说双方标准以后再对，今天先按景区这一版走"],"answer":"B","second":null,"third":null,"scored":false,"pair":"C03","faking":false,"consistency":true,"c":"0"},{"id":"C04A","dimension":"rela","stem":"一名新员工把团客的餐标发错了单，主管当着几个人问他怎么处理。你会怎么做？","opts":["当着大家把事实说清，让新员工自己讲处理办法，你不替他背也不让他一个人扛","当着大家把事情接下来处理，会后再和新员工单独复盘错在哪","当着大家说他刚来不懂规矩，以后别再犯","让他自己把错误想清楚，想不明白就一直改到对为止"],"answer":"A","second":null,"third":null,"scored":false,"pair":"C04","faking":false,"consistency":true,"c":"0"},{"id":"C04B","dimension":"rela","stem":"新员工把团客的餐标发错了单，主管打算在晨会上点名批评。同事说新人犯个错，批评两下就过了。你会怎么做？","opts":["当着大家把事实说清，让新员工自己讲处理办法，你不替他背也不让他一个人扛","当着大家把事情接下来处理，会后再和新员工单独复盘错在哪","当着大家说他刚来不懂规矩，以后别再犯","让他自己把错误想清楚，想不明白就一直改到对为止"],"answer":"A","second":null,"third":null,"scored":false,"pair":"C04","faking":false,"consistency":true,"c":"0"},{"id":"C05A","dimension":"comm","stem":"领导让你今天下班前交一份两天才能做完的复盘材料。你会怎么做？","opts":["先回清楚今天能交到什么程度、哪一点需要领导拍板，请他先看能出的部分","先应下来，把今天能做的做完，做不完的部分如实标出来交上去","先回一句没问题我今天给您，到时再说","说自己手上还有别的事，让领导先找别人"],"answer":"B","second":null,"third":null,"scored":false,"pair":"C05","faking":false,"consistency":true,"c":"0"},{"id":"C05B","dimension":"comm","stem":"领导让你今天下班前交一份两天才能做完的复盘材料。同事说领导开口了，先应下来再说。你会怎么做？","opts":["先回清楚今天能交到什么程度、哪一点需要领导拍板，请他先看能出的部分","先应下来，把今天能做的做完，做不完的部分如实标出来交上去","先回一句没问题我今天给您，到时再说","说自己手上还有别的事，让领导先找别人"],"answer":"B","second":null,"third":null,"scored":false,"pair":"C05","faking":false,"consistency":true,"c":"0"},{"id":"C06A","dimension":"team","stem":"一家合作商户在业主群里说你们部门卡他的审批，其实审批材料只差一份。你会怎么做？","opts":["先把缺的那份材料找出来给他，同时在群里说清审批卡在哪一步","私下找到他，把材料和流程讲清楚，让他知道差在哪、下一步怎么补","回一句我们流程就是这样，让他自己去问同事","让手下的同事去回这条消息，自己不接"],"answer":"A","second":null,"third":null,"scored":false,"pair":"C06","faking":false,"consistency":true,"c":"0"},{"id":"C06B","dimension":"team","stem":"一家合作商户在群里抱怨你们部门卡他的审批，其实只差一份材料。你的下属说这种小事我回一句就行。你会怎么做？","opts":["先把缺的那份材料找出来给他，同时在群里说清审批卡在哪一步","私下找到他，把材料和流程讲清楚，让他知道差在哪、下一步怎么补","回一句我们流程就是这样，让他自己去问同事","让手下的同事去回这条消息，自己不接"],"answer":"A","second":null,"third":null,"scored":false,"pair":"C06","faking":false,"consistency":true,"c":"0"}]},"m3":{"meta":{"version":"1.0","title":"思维逻辑与推理能力测评","minutes":45,"items":40,"dims":8,"source":"云上文旅集团候选人第三项测试_20261024.html（QUESTIONS / DIMS / LEVELS / REPORT）"},"intro":"本测评测的是在陌生问题上的推理与判断，不是知识量，也不是性格。全卷 40 题、8 个维度、限时建议 45 分钟，答完即出结果。","dims":{"DED":{"name":"演绎推理","short":"从前提推结论","what":"从给定的条件和规则出发，一条一条推出唯一结论。重点考「只有…才…」「除非…否则…」这类条件表述的准确拆解，以及多条件组合后结论是否还成立。对应到工作里，就是制度适用范围判断、审批链条推演、责任归属界定，以及结论有没有被前提真正支撑。","high":"能在信息不完整时先锁定必要条件，不被「听起来合理」的说法带走。习惯先问：这个结论需要什么前提才成立，前提满足了吗。","low":"容易把「通常如此」当成「必然如此」。在制度执行、风险定性、责任归属这类判断上容易出现偏差，且偏差常在事后才被发现。","job":"主要体现在制度执行的一致性、跨部门判断依据是否统一、事件定性是否准确。","risk":"把个例当通则、对例外情形不做条件检查，容易造成同类问题反复发生。","action":"重要判断用「前提—结论」两栏式留痕；制度例外情形指定复核人。","probe":["讲一次你推翻自己原本判断的经历，当时缺的是哪个前提。","遇到和你经验不一致的制度要求时，你的第一反应是什么。"],"en":"Deductive Reasoning"},"IND":{"name":"归纳推理与模式识别","short":"从现象找规律","what":"从若干具体现象里提炼规律并预测下一个，包括数据序列、符号与图形序列、现象归类，以及分辨「看起来相似其实不同」。这是面对新场景时最基础的一层能力。","high":"能从零散现象里提炼共性，也能识别例外，不会被表面相似误导。对新问题的第一反应是找结构，不是找类比。","low":"面对陌生问题容易无从下手，或把偶然当成必然。对重复出现的信号不够敏感，规律往往要别人指出来。","job":"主要体现在从经营数据里看出趋势、从客诉里归出共性原因、从人员与成本数据里发现结构性问题。","risk":"把个案当规律直接定政策，或反过来忽视已经重复出现的信号。","action":"新规律先做小样本验证再推广；给新问题配一份同类参考案例库。","probe":["讲一次你从数据里发现别人没注意到的规律，结论是什么、怎么验证的。","你判断事情是「常态」还是「例外」，通常靠什么证据。"],"en":"Inductive Reasoning"},"NUM":{"name":"数量推理与数据素养","short":"读数换口径比量级","what":"读懂数字之间的关系并正确换算口径：百分比与百分点、比率与倍数、占比与分母、增长与贡献。考的不是算得快，而是口径对不对、量级判断准不准。","high":"看报表先看口径与分母，能快速判断哪个指标真正说明问题，对异常波动的第一反应是查结构而不是下结论。","low":"容易把「数字变大」等同于「变好」，把比例变化当成绝对量变化。在汇报和决策中容易选错指标，或者用错了分母。","job":"主要体现在成本、人效、客诉率、预算执行率等日常判断的准确度上。","risk":"指标口径混用导致整体判断偏移；数字被断章取义地向上或向下传达。","action":"每张固定报表标注分子、分母与统计周期；重大结论要求双口径复核。","probe":["举一个你发现的「数字对但结论错」的例子。","你拿到一张陌生报表，第一步会看什么。"],"en":"Numerical Reasoning"},"CON":{"name":"约束分析与约束求解","short":"多条件下的唯一解","what":"多个条件同时成立时，找出唯一满足全部条件的安排。考的是把零散条件组合起来、不遗漏也不冲突的能力，对应排班、排产、排程、资源冲突取舍。","high":"排布资源时能同时守住多条约束，并提前看出冲突点在哪。方案给出去基本不用返工。","low":"容易顾此失彼：解决了眼前这一件事，却在后面埋下冲突，要靠反复返工纠偏。冲突常常在上线前或交接时才暴露。","job":"主要体现在资源冲突时的取舍、多条件排期、人与岗的匹配，以及方案落地前的可行性校验。","risk":"方案落地才发现前提不成立，返工成本高，且容易牵连已经配合的外部方。","action":"复杂排布先列约束清单再排；关键岗位与关键时段保留备选方案。","probe":["讲一次你要同时满足多个互相冲突要求的经历，最后怎么取舍。","你通常怎么把一个复杂安排变成别人能执行的样子。"],"en":"Constraint Reasoning"},"SPA":{"name":"图形与空间推理","short":"无文字依赖的结构推理","what":"在没有文字依赖的情况下处理图形、符号、方位与数量关系，从已知步骤推出下一步。考的是结构化抽象与空间想象，对应系统流程设计、动线与空间布置、规则模型的建立。","high":"面对陌生结构能迅速建立规则模型，并用同一套规则解释多个现象。看方案时脑子里有画面。","low":"更依赖现成模板，遇到没见过的结构容易凭直觉试错、耗时明显变长。方案设计阶段卡在「想不到」而不是「想不到怎么办」。","job":"主要体现在新业务模式设计、系统与流程方案、现场动线与安全布置、规则型产品的规则设计。","risk":"方案设计时只套旧模板，遇到新约束就卡住；对空间与流程的隐患缺乏直觉，容易在现场暴露。","action":"新问题先花时间建模再动手；重要方案先做一次图形化的沙盘推演。","probe":["举一次你把一个复杂问题「画出来」才想通的例子。","你看一份平面布局或流程图时，最先注意到什么。"],"en":"Abstract & Spatial Reasoning"},"CRI":{"name":"批判性思维与论证评估","short":"看结论站不站得住","what":"判断一段说法是否被材料支撑：结论是什么、依赖哪些假设、证据够不够、相关是否等于因果、统计口径有没有变。这是所有管理判断的底层校验。","high":"会主动追问「这个结论靠什么成立」，对数据来源与口径保持敏感，能分辨观点和证据。","low":"容易被有说服力的表述带走，也容易把「同时发生」直接当成「因果」，结论常常比证据走得更远。","job":"主要体现在内部方案评审、对外汇报口径把关，以及对上沟通时能不能提出关键问题。","risk":"带着未验证的判断上线，或因错误归因把资源投到错误方向，纠正成本高。","action":"评审模板固定增加「证据与假设」两栏；重要结论要求附数据口径与来源。","probe":["举一次你因为质疑一个结论而改变决策的经历。","别人给出一个让你信服的数字时，你会追问什么。"],"en":"Critical Thinking"},"PLN":{"name":"规划与问题解决","short":"排顺序分轻重","what":"把一件事拆成有先后关系的步骤，在资源有限时排优先级，并在多个方案之间做取舍。看的是计划有没有落到先后与轻重上。","high":"先定关键路径再排细节，遇到突发也知道先止损还是先查因。计划变更后能快速重排并说明代价。","low":"容易一头扎进细节、先后顺序不清；计划一改就乱，原本排好的事被挤掉，事后归因也常停在表象。","job":"主要体现在年度与月度计划、专项推进、应急预案，以及复盘改进是否落到动作。","risk":"进度失控、关键环节被漏排、复盘停在「沟通不足」这类无法执行的说法上。","action":"项目启动先画依赖关系与关键路径；复盘固定追问到可执行的动作。","probe":["讲一次计划被打乱后你怎么重排，牺牲了什么、为什么这么选。","你判断一件事该先做还是后做，标准是什么。"],"en":"Planning & Problem Solving"},"RSK":{"name":"风险判断与决策偏差","short":"不确定下的取舍","what":"在信息不完整时做取舍，并看出判断被哪些常见偏差带偏：被第一个数字锚定、因已经投入而不肯停、只找支持自己观点的证据、对罕见事件概率估计失真。","high":"会给重要决定设止损线与备选方案，并主动去找反面证据。出事时不慌，能分清该止损还是该查因。","low":"判断容易被第一个信息、当时的情绪或已经付出的成本支配；很少复盘自己的决策方式，同类错误容易重复出现。","job":"主要体现在应急处置、投诉与客诉决策、供应商与投入判断、对外承诺的风险控制。","risk":"单点依赖、承诺过头、风险敞口累积到不可控，出事时才被集体发现。","action":"重大决策写清最坏情况与触发条件；决策后做一次记录式复盘。","probe":["举一次你推翻自己坚持并及时止损的经历。","你做过的一个决定，回头看会改的是哪一步。"],"en":"Judgment under Uncertainty"}},"levels":[{"key":"T","name":"顶尖","range":"P90 以上（T≥63）","desc":"在这一项上明显高于同类岗位的常见要求。复杂问题能快速结构化，并且会自己校验结论，适合承担高复杂度、高自主度的任务。"},{"key":"A","name":"优秀","range":"P70–P89（T 55–62）","desc":"达到并超过常见要求。复杂推理与风险判断稳定可靠，可以独立负责跨部门与专项类工作。"},{"key":"B","name":"良好","range":"P45–P69（T 48–54）","desc":"满足岗位基本要求，复杂场景需要流程与复核兜底。常规场景判断准确；遇到信息不全或条件复杂的场景时，需要靠流程与复核来兜底。"},{"key":"C","name":"合格","range":"P25–P44（T 42–47）","desc":"达到常见要求的下限，余量不大，建议加强与复核：上岗前针对短板维度做案例复盘与带教，关键决策保留双人复核。"},{"key":"D","name":"待提升","range":"P25 以下（T<42）","desc":"这一项低于同类岗位的常见要求，需要更多支持与带教。建议先在常规决策与数据口径上做专项训练，关键判断安排复核与带教。"}],"questions":[{"id":"DED-1","dim":"DED","difficulty":1,"stem":"某景区规定：员工只有在完成年度安全培训后，才能申请进入配电房巡检。小李已完成培训，小张尚未参加培训。由此可以推出的是哪一项？","grid":null,"options":["小张目前不能提交配电房巡检申请","小李无需审批即可直接进入配电房","小张补做培训后就能立即获得巡检资格","完成培训是申请巡检的充分条件"],"answer":0,"explain":"规定给出的是必要条件：完成培训是申请巡检的前提，取逆否可得，未完成培训就不能提交申请。小张尚未参加培训，因此此时不能提交申请，A 项成立。B 项在规定里找不到依据，制度只约束申请环节，没有说可以跳过审批直接进入。C 项把消除申请门槛等同于拿到资格，资格还要走审批。D 项混淆必要与充分，规定只说缺培训不能申请，没说培训后就一定能申请。"},{"id":"IND-1","dim":"IND","difficulty":1,"stem":"某景区今年 1 至 5 月的用工成本（万元）依次为：12、15、18、21、24。按同一规律，6 月的用工成本是多少万元？","grid":null,"options":["26 万元","27 万元","30 万元","36 万元"],"answer":1,"explain":"五个数相邻两项的差都是 3，构成等差数列，下一项为 24+3=27，B 项成立。A 项 26 是把公差误记成 2；C 项 30 是误把首两项的比值 1.25 当成公比，按 24×1.25 外推，但 15→18 的比值是 1.2，比值并不稳定；D 项 36 是把公比误记成 1.5。只有 27 与前五项的公差完全一致。"},{"id":"NUM-1","dim":"NUM","difficulty":1,"stem":"某景区客服中心把月度客诉率挂上经营看板：上月 4.0%，本月 3.2%。集团要求本期复盘统一用百分点表述该指标相对上期的变动幅度，答案是：","grid":null,"options":["下降 0.8 个百分点","下降 20 个百分点","下降 0.8%","下降 20%"],"answer":0,"explain":"客诉率是两个百分数，相减 4.0%−3.2%=0.8，差值的单位仍然是百分点，所以 A 正确。B 把相对降幅当成了百分点，而百分点只能由两个百分数相减得到；C 漏掉了百分点这个单位，等于在讲相对比例；D 的 20% 由 0.8÷4.0 算出，是相对降幅，不能用来表示百分数之差。"},{"id":"CON-1","dim":"CON","difficulty":1,"stem":"一次跨部门评审，四名中层分别负责预算、合同、纪要、比价四份材料各一份。已知甲不负责预算材料，乙负责合同材料，丙不负责合同材料，丁负责预算材料，甲也不负责比价材料。那么丙负责的是：","grid":null,"options":["比价材料","合同材料","纪要材料","预算材料"],"answer":0,"explain":"预算材料已由丁承担，合同材料由乙承担；甲不负责预算也不负责比价，手里只剩纪要材料，因此纪要归甲，四份材料里剩下的比价只能归丙，A 正确。B 与题设丙不负责合同材料直接冲突；C 中的纪要材料已经落在甲身上；D 的预算材料已明确由丁负责，甲和丙都拿不到。"},{"id":"SPA-1","dim":"SPA","difficulty":1,"stem":"某景区导览牌上排着一串提示符号，从左到右依次是：● ○ △ ● ○ △ 。按同样的规律继续排下去，紧接在第 6 个符号之后的第 7 个位置，应该放哪个符号？","grid":["● | ○ | △ | ● | ○ | △ | ?"],"options":["●","○","△","□"],"answer":0,"explain":"这串符号每 3 个一循环：第 1、4、7 位是 ●，第 2、5 位是 ○，第 3、6 位是 △。题干给出的前 6 位完全符合这个循环，所以第 7 位回到循环起点，应是 ●。○ 只出现在第 2、5 位，△ 只出现在第 3、6 位，都对不上第 7 位；□ 在整串里从未出现，不是这套规律的组成部分。"},{"id":"CRI-1","dim":"CRI","difficulty":1,"stem":"行政人事部统计发现，近半年开展过服务礼仪专项培训的景区，客诉量都低于未开展的景区，于是提出：培训是降低客诉量的有效手段，应在集团全面推广。以下哪项最可能是这份材料的问题所在？","grid":null,"options":["客诉低也可能由客流多少造成，材料未排除此因","应补充各景区培训场次与参训人数明细","客诉量应由同一人统一汇总统计口径","推广前还需核算培训本身的费用投入"],"answer":0,"explain":"这份论证把开展过培训的景区客诉少，直接当成培训减少了客诉，但客诉低的景区可能只是处在客流淡季或刚调过价，材料没有排除训练之外的原因，属于把相关当成因果。选项 B 和 C 只是补充细节或统计分工，能让材料更完整，但不影响结论是否站得住；选项 D 讨论的是投入产出，属于成本问题，不是这份因果结论的薄弱环节。"},{"id":"PLN-1","dim":"PLN","difficulty":1,"stem":"新员工入职要依次完成四件事：①在人事系统录入并生成工号；②制作并发放工牌；③开通企业邮箱；④把入职材料与培训通知发送到该邮箱。已知工牌内容取自①生成的工号，邮箱账号前缀取自②发放的工牌编号，培训通知必须用③开通的邮箱发出。正确的执行顺序是？","grid":null,"options":["①录入 → ②工牌 → ③邮箱 → ④通知","②工牌 → ①录入 → ③邮箱 → ④通知","①录入 → ③邮箱 → ②工牌 → ④通知","③邮箱 → ①录入 → ②工牌 → ④通知"],"answer":0,"explain":"工牌要用①生成的工号，所以①必须在②之前；邮箱账号前缀取自②的工牌编号，所以②必须在③之前；通知要由③开通的邮箱发出，所以③必须在④之前。四步先后被完全锁定，只能是①②③④。把发放工牌排在生成工号之前的做法，与工牌内容取自①生成的工号相矛盾；在②之前开通邮箱，账号前缀无从取得；在③之前发通知，那时邮箱还不存在。"},{"id":"RSK-1","dim":"RSK","difficulty":1,"stem":"客服系统改版已投入 80 万元，还差最后 10 万元就能上线。管理层提出：已经投了这么多，不上线就全浪费了，本季度一定推。以下哪项判断最站得住？","grid":null,"options":["该看系统现在能否带来预期收益，不看已投的 80 万","已投 80 万，再投 10 万一定比放弃划算","已花的钱不该再考虑，应直接停止项目","应先确认剩余 10 万预算是否落实到位"],"answer":0,"explain":"已经花掉的 80 万元无论上不上线都收不回来，属于沉没成本，不该进入继续还是停止的比较；该比的是再投 10 万元与放弃改用其他方案谁更划算。选项 B 拿沉没成本当理由，越投越难停；选项 C 虽然不再算旧账，但直接断言停止更优，同样没有依据；选项 D 是预算确认动作，不构成对该不该上线的判断。"},{"id":"DED-2","dim":"DED","difficulty":2,"stem":"采购部规定：新供应商进入合格供应商名录，必须同时满足两项条件——近三年内无重大质量事故记录，且通过现场审核。甲公司近三年无重大质量事故记录，但未通过现场审核；乙公司通过了现场审核，但近三年有一笔重大质量事故记录。以下判断中能够成立的是哪一项？","grid":null,"options":["甲、乙两家公司都能进入合格供应商名录","甲、乙两家公司都不能进入名录","甲公司能进入名录，乙公司不能","乙公司能进入名录，甲公司不能"],"answer":1,"explain":"进入名录要求两项条件同时成立。甲公司缺通过现场审核这一项，乙公司缺近三年无重大质量事故这一项，两家各缺一项，都不满足这个组合条件，所以都进不了名录，B 项成立。A 项把条件当成满足其一即可；C 项见甲公司缺审核却判它能进，忽略了这里是且不是或；D 项对乙公司作同样误判，它有事故记录同样不达标。"},{"id":"IND-2","dim":"IND","difficulty":2,"stem":"某客服团队近六个月的月度客诉单量依次为：8、12、9、15、10、18。按这组数据反映的规律，第 7 个月的客诉单量预计是多少件？","grid":null,"options":["11 件","21 件","13 件","28 件"],"answer":0,"explain":"拆成两条交错序列：奇数位 8、9、10、11 每次加 1，偶数位 12、15、18 每次加 3。第 7 位在奇数位那条，得 10+1=11，A 项成立。相邻差 4、-3、6、-5、8 正负交替，下一差 -7，18-7 同为 11，两种读法一致。B 项 21 是把偶数位序列接着往下排；C 项 13 是两条序列错位相加；D 项 28 把相邻差当等差外推。"},{"id":"NUM-2","dim":"NUM","difficulty":2,"stem":"某客服中心分两个班组：A 班 10 人，人均月处理工单 120 单；B 班 30 人，人均月处理工单 80 单。若按人数加权计算，该中心整体人均月处理工单量约为：","grid":null,"options":["90 单","80 单","100 单","120 单"],"answer":0,"explain":"整体人均要先把两个班组的总工单加起来，再除以总人数：10×120+30×80=3600 单，除以 40 人得 90 单，A 正确。B 是 B 班自身的 80 单，忽略了人数只有 10 人的 A 班把均值拉高；C 用两组人均简单平均，忽略了 10 人与 30 人的权重差；D 直接取两组人均里较高的一个，仍是单组水平。"},{"id":"CON-2","dim":"CON","difficulty":2,"stem":"某集团三个部门今年的培训预算与参训人数为：A 部 30 万元、150 人；B 部 40 万元、100 人；C 部 50 万元、200 人。小李与小王各负责其中一个不同的部门，已知两人负责的部门都不是人均培训预算最高的部门，且小李负责的部门参训人数更多。那么两人分别负责的部门是：","grid":null,"options":["小李 A 部、小王 C 部","小李 C 部、小王 A 部","小李 C 部、小王 B 部","小李 A 部、小王 B 部"],"answer":1,"explain":"先算人均：A 部 30÷150=0.2，B 部 40÷100=0.4，C 部 50÷200=0.25 万元，最高是 B 部，两人都不能负责，只剩 A、C 两部。C 部 200 人多于 A 部 150 人，小李负责人数多的 C 部，小王负责 A 部，B 正确。A 把两人对调；C 让小王负责被排除的 B 部；D 中小李领了人数更少的 A 部，小王却落在 B 部。"},{"id":"SPA-2","dim":"SPA","difficulty":2,"stem":"下面上下两行分别是图 1 和图 2，每行 3 个格子。把图 2 的图形逐格叠放到图 1 上（同一列上下对齐），叠好后一个格子里可能同时有上下两个符号，这种格子要按 2 个符号算。合并后一共出现多少个符号？","grid":["● | ○ | △","● | ★ | △"],"options":["3 个","4 个","5 个","6 个"],"answer":1,"explain":"第 1 列上下都是 ●，重合只算 1 个；第 3 列上下都是 △，只算 1 个；只有第 2 列上下不同，是 ○ 和 ★，要算 2 个。合计 1+2+1=4 个符号。3 个是把第 2 列的 ○ 和 ★ 误并成了 1 个；5 个是把两个图形直接相加 6 个后只扣掉一处重合；6 个等于完全没扣除重合部分。"},{"id":"CRI-2","dim":"CRI","difficulty":2,"stem":"一位主管提出：只要周末排班多安排两个人，客诉就能降下来。依据是过去一年里客诉较多的周末，排班人数都少于其他周末。以下哪项最可能是这份建议的问题所在？","grid":null,"options":["应先挑两个周末做对比试点再推广","客诉多的周末本就客流高峰，人少是客流所致","排班人数的记录可能存在漏记","还应统计其他岗位周末的人力配置"],"answer":1,"explain":"排班人数少和客诉多同时出现，只能说明两者相关，不能说明是排班导致客诉。客诉集中的周末往往本身就是客流高峰，人少是因为需求大，因果方向可能正好颠倒。选项 A 是推广前的验证安排，属于方法建议，没有指出论证本身的毛病；选项 C 是数据可靠性的假设，材料并未提示漏记；选项 D 是补充统计维度，同样没有触及相关被当成因果这一核心。"},{"id":"PLN-2","dim":"PLN","difficulty":2,"stem":"周一上午你只有半天时间处理四件事：①恢复一名新员工的电脑登录，否则他上午没法带新同事；②回复审计部关于两家供应商付款流程的书面问询，问询写明当天 18:00 前回复；③审批一位中层提交的加班申请；④确认三处排班冲突后发给三个部门。按先办有硬时限且涉及对外承诺的事这一原则，应先做哪一件？","grid":null,"options":["①恢复新员工电脑登录","②回复审计部的书面问询","③审批加班申请","④确认三处排班冲突"],"answer":1,"explain":"四项里只有②同时具备硬时限（当天 18:00）和对外承诺对象（审计部），逾期会留下对外记录问题，因此应先办。①虽然影响当天带教，但属内部可协调事项，没有写明截止时间；③加班申请推到下午审批不影响当日运转；④排班冲突虽涉及三个部门，只要在发班表前确认就还来得及。"},{"id":"RSK-2","dim":"RSK","difficulty":2,"stem":"运营经理主张上会员卡方案，理由是别的景区都做会员卡、这是趋势，我们的价格定 399 元跟他们差不多。会上有人提出新卡可能带来退款压力和收入递延，经理回应这些等上线后看数据再说，随即让团队先准备上线物料。以下哪项最可能是这段决策的问题？","grid":null,"options":["上线前应先做一次市场容量测算","提出的风险没有任何验证安排，结论先于证据","上线物料的准备周期可能不够用","会员卡的权益条款可能设计得不够细"],"answer":1,"explain":"会上唯一提出的反对风险被一句上线后再看数据带过，没有指定由谁验证、何时验证，等于让结论先成立再去找支持材料；同时拿别的景区做法和价格当参照，让现成数字替代了针对本景区客流的判断。选项 A、C、D 都是该做的事，但都停留在补充信息，没有指出反对意见未经检验就被搁置这一决策方式上的问题。"},{"id":"DED-3","dim":"DED","difficulty":2,"stem":"财务制度规定：一笔加班费用必须同时满足两项条件才能计入补偿——已提交加班申请，且经直属主管批准；任一项不满足，该笔费用不予补偿。本季度共记录超时工作 18 笔，其中 6 笔未计入补偿，另外 12 笔已计入补偿并完成发放。由此能够推出的是哪一项？","grid":null,"options":["那 6 笔都没有提交加班申请","那 6 笔中已有部分获得主管批准","那 6 笔都至少有一项条件不满足","只要主管批准，加班费用即可计入补偿"],"answer":2,"explain":"计入补偿要两项条件同时成立，不计入补偿就意味着至少一项没满足，所以那 6 笔各自都缺一项条件，C 项成立。A 项下得太满：这几笔也可能申请了但主管没批。B 项信息不足，题干只说未计入补偿，看不出其中哪几笔获批。D 项把条件当成批准一项即可，忽略了提交申请同样是必需条件。"},{"id":"IND-3","dim":"IND","difficulty":2,"stem":"集团为五个试点单位分配了编号：11、13、17、19、21。下列编号中，与其余四个不属于同一类的是哪一个？","grid":null,"options":["编号 11","编号 13","编号 17","编号 21"],"answer":3,"explain":"11、13、17、19 都是质数，只能被 1 和它本身整除，四者同类；21 等于 3 乘 7，是合数，也是五个里唯一能被 3 整除、唯一各位数字和为奇数的那个，判据都指向它，故 21 与其余四个不同类，D 项成立。换其他分法也分不出另一种 4 比 1 结构。A 项 11、B 项 13、C 项 17 本身都是质数，与另外三个同类，不能当选。"},{"id":"NUM-3","dim":"NUM","difficulty":2,"stem":"某市场部年初预算 200 万元，上半年实际执行 108 万元，下半年计划支出 92 万元。年中复盘时，该部门按本期执行额除以年初预算的口径汇报，预算执行率是：","grid":null,"options":["46%","54%","100%","108%"],"answer":1,"explain":"预算执行率的分母是年初预算 200 万元，本期执行额是 108 万元，108÷200=54%，B 正确。A 把下半年计划支出 92 万元当成本期执行额，那 46% 是计划数占预算的比例；C 用上半年执行加下半年计划共 200 万元去除以年初预算，算的是全年预算够不够用，不是执行进度；D 直接把执行额当百分比，没做除法换算。"},{"id":"CON-3","dim":"CON","difficulty":2,"stem":"某分公司三个营业网点合计编制 36 人，三个网点人数互不相同，且每个网点人数都是不小于 6 人的 6 的倍数。已知甲网点人数多于乙网点，丙网点人数少于乙网点。那么乙网点的人数是：","grid":null,"options":["18 人","24 人","12 人","6 人"],"answer":2,"explain":"两条条件合起来是甲多于乙、乙多于丙。若丙取到 12 人，乙至少 18 人、甲至少 24 人，三人相加超过 36 人，所以丙只能取 6 人；乙与甲都是 6 的倍数、合计 30 人且乙小于甲，只能是乙 12 人、甲 18 人，C 正确。A 把乙与甲对调；B 的 24 人配上 12 人和 6 人合计 42 人，超出编制；D 的 6 人是丙的人数，乙不可能与丙相等。"},{"id":"SPA-3","dim":"SPA","difficulty":2,"stem":"一张正方形纸先沿中线上下对折，再沿中线左右对折，折痕把原纸分成 2×2 四个区域（见下图，● 所在区域是打洞位置，○、△、□ 只是位置标记）。把折好的纸叠齐，在 ● 对应的位置打 1 个穿透所有纸层的洞，再把纸完全展开。原纸上一共有几个洞？","grid":["● | ○","△ | □"],"options":["1 个","2 个","4 个","8 个"],"answer":2,"explain":"对折两次后，纸叠成 4 层，一个洞会一次穿透全部 4 层，展开后就是 4 个洞，分别落在原纸的四个区域里、位置互为镜像对称。1 个对应只扎穿了最上面一层；2 个对应只考虑了一次折叠；8 个是把两次对折算成能把一张纸叠出 8 层，超出了实际层数。"},{"id":"CRI-3","dim":"CRI","difficulty":2,"stem":"集团季度报告写道：本季度人均差旅费同比上升 20%，说明差旅费用管控有所放松。财务补充说明：同期差旅总支出只上升约 3%，而在册人数减少了约 14%。以下哪项最能解释这组数据？","grid":null,"options":["员工出差报销标准比去年放宽了","出差频次随业务增长明显提高","人均上升主因在人数减少，分母变小","两个部门统计口径不一致，数据有误"],"answer":2,"explain":"人均费用等于总支出除以人数。总支出只涨 3%、人数减少约 14%，分母缩小把人均数抬高，就出现总额基本没涨、人均明显涨的结果，说明管控未必放松，是分子分母口径变化造成的假象。选项 A 和 B 都假设支出结构本身变了，但总支出只涨 3% 与之矛盾；选项 D 把差异当成数据错误，而财务给出的对应关系本身可以算通，无需假定出错。"},{"id":"PLN-3","dim":"PLN","difficulty":2,"stem":"一个跨部门项目拆成五步：①数据口径确认（2 天）、②系统开发（5 天）、③数据迁移（3 天）、④用户验收测试（2 天）、⑤上线培训（1 天）。②完成才能开始③，③完成才能开始④；①与②可同时开工，①完成后也不阻塞后续。客户要求 11 天内上线。以下哪项判断正确？","grid":null,"options":["①是瓶颈，缩短①能提前两天","②和③不在关键路径上，可同时压缩","关键路径为②→③→④→⑤，①并行不延长工期","缩短⑤对压缩总工期没有作用"],"answer":2,"explain":"①只要 2 天且与②并行，②完工时①早已结束，工期由②(5)+③(3)+④(2)+⑤(1)=11 天决定，关键路径是②→③→④→⑤。选项 A 说①是瓶颈且能提前两天，方向反了，①再快也不改变 11 天；选项 B 把②、③说成不在关键路径上，与串行依赖矛盾；选项 D 说缩短培训无用，但⑤在关键路径上，缩短 1 天工期就少 1 天。"},{"id":"RSK-3","dim":"RSK","difficulty":2,"stem":"年度活动前的安全评审列出三项隐患：仓库消防通道堆放纸箱，每季度都可能发生、单次影响轻微；索道年检过期三天，约十年才遇到一次，一旦发生要停业整改并赔偿；财务付款审批权限划分不清，每季度遇到一次、影响中等。以下哪项处置方式最合适？","grid":null,"options":["对消防通道堆放按月通报即可","年检十年才一次，口头提醒即可","对年检过期按低概率高损失处置并准备预案","三项统一按季度巡检频率同步处理"],"answer":2,"explain":"年检过期概率极低，但一旦发生要停业整改并赔偿，损失远大于另外两项，属于典型的低概率高损失情形，应立刻补办并准备好停业预案和替代运力，把损失上限压下来。选项 A 和 B 都是拿概率低来推迟处理，忽略了大损失；选项 D 把三种不同性质的风险拉成同一频率，高损失那一项反而得不到专门准备。"},{"id":"DED-4","dim":"DED","difficulty":3,"stem":"门店规定：员工只有在完成合规培训并通过考核后，才能独立带客；新员工未在入职 30 天内完成合规培训的，门店须把该情况报总部备案。本季度有 3 名新员工未按期完成培训，其中 2 名在第二个月补完培训并通过考核，1 名始终未参加培训。以下哪一项与上述规定相符？","grid":null,"options":["这 3 名新员工目前都可以独立带客","报总部备案意味着这 3 人一律不能独立带客","那 3 名员工都不满足独立带客的必要条件","那 1 名始终未参加培训的员工目前不能独立带客"],"answer":3,"explain":"独立带客的必要条件是完成合规培训并通过考核，取逆否可得，缺培训就不可能独立带客，那 1 名始终未参加培训的员工因此不能带客，D 项成立。A 项不成立，因为其中 1 名员工始终缺培训这一必要条件。C 项也不成立，2 人已补完培训并通过考核，已满足该必要条件。B 项把备案当成禁带客的规定，制度里备案只是上报情况，没有禁止带客的条款。"},{"id":"IND-4","dim":"IND","difficulty":3,"stem":"某仓库的物料标签按批次排队印符号，各批标签上符号的数量依次为：1 个 ○、1 个 ●、2 个 ○、3 个 ●、5 个 ○、8 个 ●……。按这个规律，第 7 批标签上有多少个什么符号？","grid":null,"options":["13 个 ○","8 个 ○","21 个 ○","13 个 ●"],"answer":0,"explain":"每批的数量等于前两批之和：1+1=2、1+2=3、2+3=5、3+5=8，所以第 7 批是 5+8=13；符号在 ○ 与 ● 之间交替，第 1、3、5、7 批都是 ○，因此是 13 个 ○，A 项成立。B 项 8 个 ○ 是照抄上一批的数量；C 项 21 个 ○ 是把 8 与 13 继续相加；D 项 13 个 ● 是数量算对了但符号交替数错了位置。"},{"id":"NUM-4","dim":"NUM","difficulty":3,"stem":"某集团某季度总营收 3,600 万元，其中线上渠道 1,440 万元、线下门店 900 万元，其余为分销等渠道。若总营收不变，要让线上渠道占比达到 45%，线上渠道收入需要：","grid":null,"options":["1,440 万元","增加 180 万元","1,620 万元","1,800 万元"],"answer":2,"explain":"先换算成金额再比对：线上现在占 1,440÷3,600=40%，目标 45% 对应 3,600×45%=1,620 万元，C 正确。A 给的还是当前金额，等于没有调整；B 答的是增加 180 万元，题目问的是调整之后的金额；D 是把占比当成 50% 算出来的数，目标占比是 45%。"},{"id":"CON-4","dim":"CON","difficulty":3,"stem":"集团三名中层分别分管销售、生产、运营三条线，各获甲、乙、丙三个专项奖中的一项。已知：①分管销售的人拿乙奖；②分管生产的人不拿甲奖；③分管运营的人不拿乙奖；④李拿丙奖；⑤张不拿乙奖。那么下列对应关系正确的是：","grid":null,"options":["张—生产—甲奖","王—运营—甲奖","李—销售—丙奖","李—生产—丙奖"],"answer":3,"explain":"①说明乙奖在销售岗，⑤张不拿乙奖、④李拿丙奖，两人都不是销售，所以销售只能是王，乙奖归王，剩下的甲奖归张。再看②，生产岗不拿甲奖，张被排除，生产只能是李；③规定运营岗不拿乙奖，王已被排除，运营只能是张。于是李分管生产并拿丙奖，D 正确。A 中张在运营不在生产；B 中王是销售乙奖并非运营；C 中李是生产不是销售。"},{"id":"SPA-4","dim":"SPA","difficulty":3,"stem":"下面是某部门整理的一张 3×3 数字表，每格填一个数字。观察可发现：每一行从左到右，后一个数都等于这一行前两个数相加；每一列从上到下也是同样的加法关系。请推出右下角问号处应填的数字。","grid":["1 | 2 | 3","2 | 3 | 5","3 | 5 | ?"],"options":["9","6","7","8"],"answer":3,"explain":"按行看：1+2=3、2+3=5，所以第三行是 3+5=8；按列看同样成立：第 1 列 1+2=3、第 2 列 2+3=5，第 3 列 3+5=8。行规律和列规律指向同一个答案 8。9 是在 8 的基础上凭空多加 1，表里并没有出现额外 1 的规则；6 和 7 则无论按行还是按列都推不出来。"},{"id":"CRI-4","dim":"CRI","difficulty":3,"stem":"为优化客服排班，行政部复盘了上季度满意度评分排在前列的 30 名客服，总结出这 30 人全部通过了某项认证培训，据此决定在全公司推广认证培训。以下哪项最可能是这次复盘方法的问题？","grid":null,"options":["30 人样本量太小，结论难推广","应把满意度评分换成投诉率再比较","复盘时应一并记录培训的具体内容","只挑高满意度样本，说不清二者的关系"],"answer":3,"explain":"这批人是按满意度高挑出来的，本来就是表现较好的一群，通过培训但成绩差的人没有被纳入比较，所以通过培训与满意度高同时出现，得不出培训带来提升的结论，属于只挑有利样本。选项 A 说样本量小，但问题出在样本怎么挑，而不是有多少；选项 B 换指标并不解决取样偏差；选项 C 只是补充记录，同样绕开了取样方式这一关键。"},{"id":"PLN-4","dim":"PLN","difficulty":3,"stem":"集团要更换票务系统供应商，三个方案：甲 维持现有供应商一年，改动最小，但明年续约价格可能上调；乙 立即切换新供应商，报价低，但需迁移历史数据，切换失败影响面大；丙 新旧并行运行一个月后再切换，成本居中，员工要同时熟悉两套流程。以下哪项判断最站得住？","grid":null,"options":["新供应商报价最低，应立即切换，效率优先","现有供应商明年涨价，说明应当马上切换","并行一个月纯属浪费，应当直接跳过","并行的代价是短期成本上升，好处是保留回退空间"],"answer":3,"explain":"方案取舍要同时看成本、收益、风险与可逆性。选项 D 把并行（丙）的代价（短期成本上升、员工要同时熟悉两套流程）和收益（保留回退空间）都摆了出来，判断可以落到切换失败的影响面这个可讨论的点上，是站得住的取舍。选项 A 只看报价，忽略迁移失败的影响；选项 B 以明年可能涨价这个未确定的前提直接推出立即切换；选项 C 直接否掉有回退价值的做法，没有给出依据。"},{"id":"RSK-4","dim":"RSK","difficulty":3,"stem":"项目延期可能性评估会上，一位负责人说类似项目我们做过三次都按期完成，这次也一样，我有九成把握能按期。会上没有人追问前三次的条件和这次是否相同。以下哪项判断最站得住？","grid":null,"options":["负责人有实际经验，他的判断应当被采纳","九成把握只是主观估计，不需要核验","过去的成功经验越多，对本次把握就越大","先比对本项目与前三次的差异，再看估计是否可信"],"answer":3,"explain":"过去三次按期是那三次的结果，若本次的资源投入、需求范围或外部条件不同，这段历史就不能直接套用；在关键差异没有比对之前就给九成把握，是把小样本经验当成了本次的可靠依据。选项 A 只以有经验为由采信结论；选项 B 认为主观估计无需核验；选项 C 把经验越多越自信当加分项，这恰恰是需要警惕的地方。"},{"id":"DED-5","dim":"DED","difficulty":3,"stem":"采购部规定：除非供应商评估结论为合格且无重大质量投诉，否则其新订单不予审批。本年度评估的 40 家供应商中，28 家结论为合格，其余 12 家结论为不合格；这 28 家合格供应商里有 3 家存在重大质量投诉。年内获批的新订单共 22 家。以下哪一项是能够推出的？","grid":null,"options":["那 3 家有重大质量投诉的供应商新订单未获批","12 家不合格供应商中有部分新订单已获批","28 家评估合格的供应商新订单全部获批","22 家获批供应商中至少有 1 家评估不合格"],"answer":0,"explain":"规定等价于：新订单获批必须评估合格且无重大质量投诉。那 3 家供应商结论虽合格，却有重大质量投诉，缺一个必要条件，新订单不会获批，A 项成立。B 项与规定直接冲突，不合格供应商的新订单本就不予审批。C 项与数字冲突，合格供应商 28 家而获批总数只有 22 家。D 项同样与规定冲突，获批的 22 家只能来自合格且无重大质量投诉的供应商。"},{"id":"IND-5","dim":"IND","difficulty":3,"stem":"把某集团跨部门审批最近连续 5 个工作日依次记为第 1 至第 5 个工作日，初审部门分别是运营部、市场部、财务部、客服部、运营部，之后按同样顺序循环。按这一规律，第 11 个工作日的单据由哪个部门初审？","grid":null,"options":["运营部","市场部","财务部","客服部"],"answer":2,"explain":"初审部门按周期轮转，周期 p 必须整除 4：若 p=2，第 1 天与第 3 天会是同一部门，可实际运营部与财务部不同，排除；p=1 与四部门轮转不符，所以周期为 4 天。第 11 天与第 3 天相隔两个整周期，同为财务部初审，C 项成立。A 项运营部对应第 1、5、9 天，B 项市场部对应第 2、6、10 天，D 项客服部对应第 4、8、12 天。"},{"id":"NUM-5","dim":"NUM","difficulty":3,"stem":"某景区四个门店的日均客流与面积分别为：A 店 450 人、300 ㎡；B 店 600 人、500 ㎡；C 店 480 人、400 ㎡；D 店 720 人、500 ㎡。按每平方米日均客流从高到低排列（相同者并列），正确顺序是：","grid":null,"options":["A>B=C>D","A=D>B>C","A>B>C>D","A>D>B=C"],"answer":3,"explain":"客流除以面积，统一换成每平方米日均客流（单位一致才可比）后再排序，四店依次是 1.5、1.2、1.2、1.44，故 A>D>B=C，D 正确。A 把 D 排到末位，忽略了 D 的 1.44 高于 B、C 的 1.2；B 把 A 与 D 并列，可 1.5 与 1.44 并不相等；C 把 B 与 C 排成先后，两店都是 1.2，应当并列。"},{"id":"CON-5","dim":"CON","difficulty":3,"stem":"国庆 3 天，景区每天需要 6 名志愿者，共 9 人报名，每人最多上 2 天。其中 2 人第 3 天有事不能上，2 人第 1 天要送孩子不能上，其余 5 人 3 天都能上。第二天上班的 6 人中，3 天都能上的有几人？","grid":null,"options":["4 人","3 人","1 人","2 人"],"answer":3,"explain":"三天共需 18 人次，9 人最多各上 2 天，正好用满，人人上满 2 天。第 3 天不能上的 2 人必上第 1 天，凑满 6 人需 5 人组有 4 人；第 3 天同理有 4 人。该组 10 人次，第 2 天剩 2 人，D 对。A 的 4 人是第 1、3 天人数；B 的 3 人是 10−4−3，多减了 1；C 的 1 人是 5 人组里第 1 天不上班的人数。"},{"id":"SPA-5","dim":"SPA","difficulty":3,"stem":"下面是一个 3 行 4 列的方格布局，● 是出发点，★ 是目标点。每次只能向上、下、左、右移动到相邻的一格，不能斜着走，也不能停在原地。请问从 ● 走到 ★ 至少要走多少步？","grid":["● | ○ | △ | □","◇ | ○ | □ | ○","▽ | ◇ | ○ | ★"],"options":["4 步","6 步","5 步","3 步"],"answer":2,"explain":"● 在第 1 行第 1 列，★ 在第 3 行第 4 列。每一步只能改变一个方向，所以向下至少要走 2 步，向右至少要走 3 步，两者无法在同一步完成，合计至少 5 步；沿最外圈走一条不折返的路线正好 5 步到达。4 步漏算了行与列要分别跨越；6 步是多绕了回头路；3 步是按直线距离算的，但斜走和一步跨两行都做不到。"},{"id":"CRI-5","dim":"CRI","difficulty":3,"stem":"某景区一次客诉升级处理不当引发关注，随后行政部提出：今后所有客诉一律不再升级，全部由客服部当场处理。以下哪项最能指出这个建议的问题所在？","grid":null,"options":["是否对外说明应统一由品牌部门决定","升级处理前应增加一次部门负责人复核","建议应先明确客诉升级的权限划分","一次处理不当只说明升级环节有瑕疵，不能就此否定升级机制"],"answer":3,"explain":"从升级中出过问题推出不该再用升级，是把个别执行环节的失误当成了制度本身无效，以一例否定全部；升级机制在及时止损、争取处理时间上的作用并未因此消失。选项 B 和 C 是权限与流程上的具体完善建议，属于补充条款，不构成对这项建议本身的否定理由；选项 D 讨论的是对外分工，与这份论证是否成立无关。"},{"id":"PLN-5","dim":"PLN","difficulty":3,"stem":"某景区连续三周出现同一类客诉：客人到店后才发现当日无房。运营复盘时提出原因是前台没及时把满房状态同步给渠道，理由是三次发生时前台系统里的房态确实是满的。以下哪种复盘做法最有助于找到真正的根因？","grid":null,"options":["对三次客诉涉及的员工进行通报处理","沿着为什么到店才发现无房连续追问到可改做法","直接更换前台系统供应商，消除同步环节","要求前台与渠道每天固定三次核对房态"],"answer":1,"explain":"前台房态是满的，只说明没同步这一层，往上追问还可能碰到库存口径、超卖规则、房态更新时点等更靠近根部的环节，连续追问能把表面原因和根本原因分开。选项 A、C、D 都直接跳到处置或追责，跳过了先定位再处置这一步：换系统可能白花钱，固定核对只是多加一道动作，通报处理与根因无关。"},{"id":"RSK-5","dim":"RSK","difficulty":3,"stem":"一次产品改版评审先请三位资深同事发言，三人都说保持现状更好；随后五位年轻同事发言，其中四位也说保持现状更好。最终结论是保持现状，理由是大家都这么看。以下哪项最可能是这场讨论的问题所在？","grid":null,"options":["参与讨论的人数太少，结论缺乏代表性","讨论中没有引用外部市场数据作为依据","后发言者顺着前面方向调整看法，反对意见没留下","应该把最终结论交给级别最高的人拍板"],"answer":2,"explain":"后发言者的意见明显随着前面发言的方向收拢，发言顺序因此影响了结论，而讨论中没有留下相反意见的记录，这种越讨论越一致会让异议在表态阶段就消失。选项 B 说人数不足，但问题出在人数够的情况下意见如何形成；选项 C 缺数据是普遍情况，不是这场讨论特有的毛病；选项 D 用层级替代讨论，既纠正不了从众，还会让从众更严重。"}],"norm_note":"百分位基于内置参考分布（按题目难度加权的理论模型）换算，不是商业常模，也不等同于任何外部机构的常模分数。","report_note":"本结果反映候选人在逻辑推理与风险判断上的当前表现，可作为面试提问的指向与培养建议的依据，不宜单独作为录用或任用的结论；应结合专业面、结构化面试与实际工作样本共同判断。","use_note":"本结果反映候选人在逻辑推理与风险判断上的当前表现，可作为面试提问的指向与培养建议的依据，不宜单独作为录用或任用的结论；应结合专业面、结构化面试与实际工作样本共同判断。","fair_note":"测评对所有候选人使用同一套题目与同一套评分规则。若候选人在某维度表现明显异常（例如其余维度良好、该维度接近零分），建议核对是否与作答环境、时间压力或题目理解有关，必要时安排复测。","effort_note":"作答速度也是信号：明显快于思考所需时间的作答更接近猜测，明显慢于平均的作答可能受题目表述或时间压力影响，两类都建议在面试中复核。","advice_note":"反馈给候选人时，建议只讲结论等级与可执行的提升方向；错题解析可在候选人确认要复盘时再给，避免直接用于对外评价。","notice":"本测试的结果是在集团内部参考分布下的相对位置，用于了解您在推理与逻辑分析方面的能力特点，作为招聘决策的辅助参考项之一，不作为独立的录用或淘汰依据。结果不等同于任何标准化智力测验，也不代表对您的整体评价。测试由系统自动评分，您可以要求对结果进行说明，并可要求由人员复核而非仅依据自动化结果作出决定。您的测评数据将按《中华人民共和国个人信息保护法》处理，保存期限与查阅范围见附表。","must_say":["分数是相对量：参照的是集团内部设定的参考分布，不是全国或行业人群的分布，分数不反映绝对能力水平。","不等同于任何标准化智力测验：本测试不是 IQ 测试，结果不可与 Raven's、Wonderlic、SHL 等分数横向比较。","用途边界：作为招聘决策的辅助参考项之一，不得作为独立的录用或淘汰依据。","自动化评分：候选人有权要求对结果作出说明，并要求由具备相应职责的人员复核，而不是仅依据自动化结果作出对其权益有重大影响的决定。","数据处理：说明处理目的、方式、种类、保存期限与查阅范围；姓名与身份证号仅用于报告抬头与结果汇总，页面纯前端运行、不自动上传，报告默认脱敏。","施测条件与局限：在限时、无线上监考、独立完成的条件下施测，存在作答波动与无监考场景固有的局限。","效度状态：本测试的效度证据尚在积累中，当前结果定位为辅助参考。","申诉与复核通道：候选人可申请复核，由 HR 受理并反馈结论。"],"must_not_say":["不说「超过全国 X% 的管理者／考生」——参照分布是模型生成的，不是实测人群分布。","不说「相当于第 XX 百分位的人才」——百分位在模型分布下不等于人群中的位置。","不说「基于 SHL／Thomas／Raven's 开发，因而具备同等效度」——本测试是独立设计。","不说「该分数表明您具备（或不具备）某某能力」——相对位置不能断言成绝对能力。","不说「结果不会影响您的录用」——与实际流程不符且属不实承诺。","不把某个维度的低分表述为「逻辑能力差」——单维度分信度中等，只用于确定追问方向。"],"note":"说明：第三项逻辑与文案自《云上文旅集团候选人第三项测试_20261024.html》搬运（QUESTIONS / DIMS / LEVELS / REPORT），按 BUILD_CONTRACT.md §1.3 落为固定 schema。\n① 五档 desc 按《统一五级裁定表_20261024.md》§1 的对外措辞改写，去掉了带「岗位基本要求对照」与「独立担责」意味的表述：\n   · 顶尖 T：首句改为「在这一项上明显高于同类岗位的常见要求」（原首句为「认知推理明显高于该岗位常规要求」）。\n   · 优秀 A：首句改为「达到并超过常见要求」（原首句为「达到并超过岗位常见要求」）。\n   · 良好 B：首句改为「满足岗位基本要求，复杂场景需要流程与复核兜底」（原首句为「满足岗位基本要求，常规场景判断准确」）。\n   · 合格 C：首句改为「达到常见要求的下限，余量不大，建议加强与复核」（原首句为带最低线意味的表述）。\n   · 待提升 D：整句改为「这一项低于同类岗位的常见要求，需要更多支持与带教。建议先在常规决策与数据口径上做专项训练，关键判断安排复核与带教。」（原句把该档写成对岗位基本要求的对照，并带独立担责的说法，均已改写）。\n   改写后五档 desc 内不再含任何带筛选口径的措辞，也不含任何最低线表述；五档的对外措辞与裁定表 §1 一致。\n② dims（8 维）、questions（40 题，含 grid 与 explain）、五档 key/name/range、REPORT 的 intro / norm_note / use_note / must_say / must_not_say 均原样搬运，未改一字。\n③ REPORT.fair_note / effort_note / advice_note / notice 契约 schema 未列，作为同源补充保留在顶层。\n④ notice 与 must_say 中涉及「录用依据」的合规声明为原文（契约 §1.3 要求原样保留），不是筛选口径；本文件对五档 desc 的措辞改写只发生在 levels[].desc。\n⑤ report_note 与 use_note 内容一致（源 REPORT.use_note），两个键都给出以免调用侧取不到。\n⑥ 题目与档位文案只作参考材料搬运，未做信效度标注——按契约 §7，信效度须由真人试测得出。"}};

  function erf(x) {
    const s = x < 0 ? -1 : 1; x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - ((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t * t - 0; // A&S 近似
    const y2 = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y2;
  }

  function bandM1(score, bands) {

  // 档位按百分位切（与原第三项口径一致）：P90 顶尖 / P70 优秀 / P45 良好 / P25 合格 / 以下待提升
  function bandPct(p) { return p >= 90 ? "顶尖" : p >= 70 ? "优秀" : p >= 45 ? "良好" : p >= 25 ? "合格" : "待提升"; }

  /* ---------- 计分 ---------- */
  function scoreM1(S) {

    /* 第一项不给总档（ADR-0010 · 票 #30 裁定）：不产出 grade，只给四维各档 + 短板维。

    return { out: { dims: dims, short: { key: short.key, name: short.name, grade: short.grade } }, dims: dims, short: short };

      .concat(D.eq.sjt.map((x) => ({ kind: "sjt", id: x.id, dim: x.dimension, ans: x.answer, sec: x.second, thd: x.third, scored: x.scored !== false, pair: x.pair || "" })));

      });
      let selfAvg = null, flag = false;
      if (selfVals.length) {
        const avg = selfVals.reduce((a, b) => a + b, 0) / selfVals.length;
        selfAvg = (avg - 1) / 6 * 5; // 1-7 → 0-5
      }
      const avg = n ? sc / 12 * 5 : 0;
      if (selfAvg !== null && Math.abs(selfAvg - avg) >= 1.0) flag = true;
      return { key: d.key, name: d.name, score: sc, max: 12, avg: Math.round(avg * 100) / 100, grade: bandWeighted(avg), flag: flag, selfAvg: selfAvg === null ? null : Math.round(selfAvg * 100) / 100 };
    });
    // 一致性检查：同对两题都选 A/B（积极）或都选 C/D（消极）判一致；一正一负判需复核
    const pairs = {};
    M2.forEach((q, idx) => {
      if (q.kind !== "sjt" || !q.pair) return;
      const v = S.a.m2[idx];
      if (v === null || v === undefined) return;
      (pairs[q.pair] = pairs[q.pair] || []).push("ABCD"[v]);
    });
    const consistency = Object.keys(pairs).sort().map((p) => {
      const a = pairs[p];
      if (a.length < 2) return { pair: p, status: "未答完", detail: "" };
      const pos = a.filter((x) => x === "A" || x === "B").length;
      if (pos === 2) return { pair: p, status: "一致（积极型）", detail: a.join(" / ") };
      if (pos === 0) return { pair: p, status: "一致（消极型）", detail: a.join(" / ") };
      return { pair: p, status: "需复核", detail: a.join(" / ") };
    });
    const wsum = dims.reduce((s, d) => s + (d.weight || 0), 0) || 100;
    const total = res.reduce((s, r) => {
      const dim = dims.find((x) => x.key === r.key);
      return s + r.avg * ((dim && dim.weight) || 0) / wsum;
    }, 0);
    const grade = bandWeighted(total);
    const short = res.slice().sort((a, b) => ORD[a.grade] - ORD[b.grade])[0];
    return { out: { dims: res, total: Math.round(total * 100) / 100, grade: grade, short: { key: short.key, name: short.name, grade: short.grade }, needReview: res.filter((r) => r.flag).map((r) => r.name), consistency: consistency }, dims: res, grade: grade, short: short };
  }

  function scoreM3(S) {
    const dims = Object.keys(D.m3.dims);
    let wsum = 0;
    const wrong = [];
    D.m3.questions.forEach((q, idx) => {
      const p = S.a.m3[idx];
      if (p === null || p === undefined) return;
      if (p !== q.answer) wrong.push({ id: q.id, stem: q.stem, explain: q.explain || "" });
    });
    const dimArr = dims.map((k) => {
      let w = 0, c = 0, n = 0;
      D.m3.questions.forEach((q, idx) => {
        if (q.dim !== k) return;
        n++;
        const p = S.a.m3[idx];
        if (p === null || p === undefined) return;
        if (p === q.answer) { w += (W_DIFF[String(q.difficulty)] || 1); c++; }
      });
      const z = (w - DIM_MU) / DIM_SD;
      const pct = Math.max(0, Math.min(100, Math.round(phi(z) * 100)));
      const t = Math.round((50 + 10 * z) * 10) / 10;
      return { key: k, name: D.m3.dims[k].name, short: D.m3.dims[k].short, score: Math.round(w * 100) / 100,
               correct: c, total: n, rate: n ? Math.round(c / n * 100) : 0, pct: pct, t: t, grade: bandPct(pct) };
    });
    let total = 0;
    D.m3.questions.forEach((q, idx) => {
      const p = S.a.m3[idx];
      if (p === null || p === undefined) return;
      if (p === q.answer) total += (W_DIFF[String(q.difficulty)] || 1);
    });
    const z = (total - TOT_MU) / TOT_SD;
    const pct = Math.max(0, Math.min(100, Math.round(phi(z) * 100)));
    const t = Math.round((50 + 10 * z) * 10) / 10;
    const grade = bandPct(pct);
    const short = dimArr.slice().sort((a, b) => ORD[a.grade] - ORD[b.grade])[0];
    return { out: { total: Math.round(total * 100) / 100, pct: pct, t: t, grade: grade, dims: dimArr, wrong: wrong }, dims: dimArr, grade: grade, short: short };
  }

  function compose(m1, m2, m3) {
    const items = [
      { name: "第一项 · " + D.m1.meta.title, grade: m1.grade },
      { name: "第二项 · 情境测试", grade: m2.grade },
      { name: "第三项 · 推理测试", grade: m3.grade }
    ];
    const ord = items.map((i) => ORD[i.grade]);
    const avg = ord.reduce((a, b) => a + b, 0) / ord.length;
    const grade = bandComposite(avg);
    const minOrd = Math.min.apply(null, ord);
    const short = items[ord.indexOf(minOrd)];
    const skew = items.filter((i, k) => ORD[grade] - ORD[i.grade] >= 2);
    return { grade: grade, score: Math.round(avg * 100) / 100, short: short, skew: skew, items: items };
  }

  function score(S) {
    const m1 = scoreM1(S), m2 = scoreM2(S), m3 = scoreM3(S);
    /* 综合评估的第一项输入 = 短板维档（数值与旧规则的总档完全相等 ⇒ 合成结果不变）—— ADR-0010 */
    const cp = compose({ grade: m1.short.grade, dims: m1.dims }, m2, m3);
    return {
      m1: m1, m2: m2, m3: m3, compose: cp,
      out: { m1: m1.out, m2: m2.out, m3: m3.out, compose: cp }
    };
  }

  /* ---------- 报告渲染 ---------- */
  const LVL = { "顶尖": "T", "优秀": "A", "良好": "B", "合格": "C", "待提升": "D" };
  function gradePill(g) { return '<span class="grade-pill" data-level="' + (LVL[g] || "B") + '">' + esc(g) + "</span>"; }
  function gradeBlock(g, scoreText) {
    const n = ORD[g] || 1;
    const meter = '<span class="grade-meter">' + [1, 2, 3, 4, 5].map((i) => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</span>";
    return '<span class="grade" data-level="' + (LVL[g] || "B") + '"><span class="grade-name">' + esc(g) + "</span>" +
      (scoreText ? '<span class="grade-score">' + esc(scoreText) + "</span>" : "") + meter + "</span>";
  }
  /* ---------- 票 #39：口径说明块 + 五级梯 ---------- */
  /* D2 裁定（维护者 2026-10-25 12:34）：校准前一律用「绝对锚点口径 + 明写尚未校准」。
     口径出处：items/m1_design.md §九.2（档位是专家阈值，不是人群分布）+ 票 #26 §12。
     切换点：把 CALIBRATED 改成 true，四个报告块的口径说明自动换成参照人群口径的措辞 ——
     两套措辞都放在 copy.js（calibAbs / calibRef），本文件只做选择，不并排写死。 */
  const CALIBRATED = false;
  const CALIB_TEXT = CALIBRATED ? C.calibRef : C.calibAbs;
  /* 口径说明块：告诉施测人这套档位是怎么划出来的、目前还没校准。
     **只给第一项用**（票 #39 · D2 复审定稿）—— 只有第一项是绝对锚点、尚未经真人样本校准；
     第二项是加权阈值、第三项本来就是参照分布的百分位，给它们贴同一句「绝对锚点」是贴错标签。 */
  function calibNote() {
    return '<p class="calib"><b>口径说明</b>：' + esc(CALIB_TEXT) + "</p>";
  }
  /* 口径基础汇总：总报告里的一段，三项各是什么口径（校准前 / 校准后两套措辞）。
     与 calibNote 分开：一个是「第一项的档位怎么来的」，一个是「整份报告的口径地图」。 */
  function calibBasis() {
    return '<p class="calib"><b>口径基础</b>：' + esc(CALIBRATED ? C.calibBasisRef : C.calibBasisAbs) + "</p>";
  }
  /* 五级梯：从高到低（顶尖 → 待提升）五格并排。
     深绿格 = **已达到的档**（从低到高直到当前档，含当前档），当前档再加一道金线，
     浅灰格 = 未达到。与 .grade-meter「前 n 段点亮」同口径（同一人的两处图形不打架）。
     档名是主编码（文字写在格子里），底色只是辅助。 */
  const LADDER = ["顶尖", "优秀", "良好", "合格", "待提升"];
  function ladderHTML(grade) {
    const n = ORD[grade] || 1;
    return '<div class="ladder">' + LADDER.map((g) =>
      '<span class="' + (ORD[g] <= n ? "on" : "") + (g === grade ? " cur" : "") + '">' + esc(g) + "</span>"
    ).join("") + "</div>";
  }
  function ladderBlock(cap, grade) {
    return '<div class="ladder-cap">' + esc(cap) + " · 五级档上的位置（深绿＝已达到的档）</div>" + ladderHTML(grade);
  }
  /* 维度条：一行一值（票 #27）。
     .metric-row 已经是「名 + 分 + 五级胶囊」（《测评设计规范》§五组件表），
     所以条形只负责**把分数画出来**，不再在右端重复同一个数 —— 原来的
     「18/24」在上下两行各出现一次，看着像出错。 */
  function bar(label, v, max, valueText) {
    const p = Math.max(0, Math.min(100, Math.round(v / max * 100)));
    const val = valueText ? '<span class="bar-value">' + esc(valueText) + "</span>" : "";
    return '<div class="bar"><span class="bar-label">' + esc(label) + '</span><span class="bar-track"><span class="bar-fill" style="width:' + p + '%"></span></span>' + val + "</div>";
  }
  function metricRow(d) {
    return '<div class="metric-row"><span class="mr-name">' + esc(d.name) + '</span><span class="mr-score">' +
      esc(d.scoreText || (d.score + (d.max ? " / " + d.max : ""))) + "</span>" + gradePill(d.grade) + "</div>" +
      (d.max ? bar("相对表现", d.score, d.max) : "");
  }
  const RADAR_SHORT = { DED: "演绎", IND: "归纳", NUM: "数量", CON: "约束", SPA: "图形", CRI: "批判", PLN: "规划", RSK: "风险" };
  function radarSVG(dims) {
    const R = 108, cx = 180, cy = 150, n = dims.length;
    const pt = (i, r) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    };
    const poly = (arr) => arr.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const grid = [0.25, 0.5, 0.75, 1].map((f) => poly(dims.map((_, i) => pt(i, R * f))));
    const self = dims.map((d, i) => pt(i, R * Math.max(0.04, Math.min(1, d.pct / 100))));
    const labels = dims.map((d, i) => {
      const p = pt(i, R + 24);
      const p2 = pt(i, R * Math.max(0.04, Math.min(1, d.pct / 100)));
      /* 数值标在**顶点外侧**（票 #27）：之前写的是 `p2[1] < cy ? -6 : 12` —— 漏了
         `p2[1] +`，于是上半圈所有数值标签都塌到 SVG 顶边（y=-6 / 12），互相叠、
         还跟顶部维度名叠在一起，读者根本对不上哪个数属于哪一维（这正是「蛛网图的
         分数和推理测试对不上」的一半原因）。现在按顶点位置偏移：
         上半圈放顶点上方、下半圈放下方、水平轴放点的正上方。 */
      const left = p2[0] < cx - 6, right = p2[0] > cx + 6;
      const vx = left ? p2[0] - 7 : right ? p2[0] + 7 : p2[0];
      const anchor = left ? "end" : right ? "start" : "middle";
      const onAxis = Math.abs(p2[1] - cy) < 10;   // 水平轴上的顶点：数值放到点的正上方，避开维度名
      const vy = onAxis ? p2[1] - 9 : (p2[1] < cy ? p2[1] - 7 : p2[1] + 15);
      /* 数值标签写「P75」而不是「75」：这张图画的是**参考分布百分位**，
         顶点标 P 前缀 = 口径自明（不用猜是百分位还是百分数）。
         与 Word/PDF 双胞胎（src/build_report_docx.py 的 radar_svg，标 P%d）
         和下方维度行的「P75」完全同口径 —— 票 #27 的「两个口径并置」就是这么消掉的。 */
      return '<text class="radar-label" x="' + p[0].toFixed(1) + '" y="' + p[1].toFixed(1) + '" text-anchor="middle">' + esc(RADAR_SHORT[d.key] || d.short || d.name) + "</text>" +
        '<text class="radar-value" x="' + vx.toFixed(1) + '" y="' + vy.toFixed(1) + '" text-anchor="' + anchor + '">P' + d.pct + "</text>";
    }).join("");
    const axes = dims.map((_, i) => { const p = pt(i, R); return '<line class="radar-axis" x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '"/>'; }).join("");
    const dots = dims.map((d, i) => '<circle class="radar-point" cx="' + self[i][0].toFixed(1) + '" cy="' + self[i][1].toFixed(1) + '" r="3"/>').join("");
    return '<div class="radar-wrap"><svg class="radar" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="八维度相对位置雷达图">' +
      '<g class="radar-grid">' + grid.map((g) => '<polygon points="' + g + '"/>').join("") + axes + "</g>" +
      '<polygon points="' + poly(dims.map((_, i) => pt(i, R * 0.25))) + '" fill="none" stroke="#B7BEB9" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<polygon points="' + poly(dims.map((_, i) => pt(i, R * 0.5))) + '" fill="none" stroke="#C9A55C" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<polygon class="radar-area" points="' + poly(self) + '"/>' + dots + labels + "</svg></div>" +
      '<p class="note">实线 = 本次作答在参考分布上的<b>百分位</b>位置；金色虚线 = 参考分布中位（P50）；灰色虚线 = 参考分布第 25 百分位。每个顶点旁同时标注维度名与百分位数值（黑白打印也能读）；下方维度行给出该维的「对 / 总题数」与百分位、T 分，可互相核对。</p>';
  }

  function composeBlock(cp) {
    const skew = cp.skew.length
      ? '<p class="compose-note compose-flag">结构性偏科：' + cp.skew.map((s) => esc(s.name)).join("、") + " 明显低于综合水平，面试优先追问这一项。</p>"
      : "";
    return '<section class="compose"><h3 class="compose-title">综合评估</h3>' +
      '<div class="compose-head">' + gradeBlock(cp.grade, "三项等级合成") + "</div>" +
      ladderBlock("综合档", cp.grade) +
      '<p class="compose-note">综合评估由三项的等级合成（顶尖 5 / 优秀 4 / 良好 3 / 合格 2 / 待提升 1，等权平均后切档），<b>不代表总分</b>，也不作一票否决的依据，只用来决定面试追问什么。</p>' +
      skew + "</section>" +
      '<div class="short-board">短板：<b>' + esc(cp.short.name) + "（" + esc(cp.short.grade) + "）</b>。" +
      (cp.short.name.indexOf("第一项") >= 0 ? "短板指该项最弱的一维（第一项取四维里的最低维）。" : "短板指该项最弱的一维。") + "</div>";
  }
  function listMetrics(cp) {
    return '<div class="list-metrics">' + cp.items.map((i) =>
      '<div class="metric"><div class="metric-name">' + esc(i.name) + '</div><div class="metric-value">' + gradePill(i.grade) + "</div>" +
      '<div class="metric-note">短板提示见各模块报告页</div></div>').join("") + "</div>";
  }

  function build(data) {
    if (!data || !data.m1 || !data.m2 || !data.m3) throw new Error("结果数据不完整");
    const cp = data.compose || compose(
      { grade: data.m1.short.grade, dims: data.m1.dims },
      { grade: data.m2.grade, dims: data.m2.dims },
      { grade: data.m3.grade, dims: data.m3.dims }
    );
    /* 到点只提示、不自动交卷，且**不留任何到点痕迹**（票 #39 · D3 复审定稿）——
       结果里既没有用时字段，也没有 limitCut / limitHint；旧结果 JSON 照常渲染。 */
    return { code: data.code, name: data.name, idLast4: data.idLast4, date: data.date, m1: data.m1, m2: data.m2, m3: data.m3, compose: cp };
  }

  function secHTML(R, id) {
    const cp = R.compose;
    if (id === "total") {
      return composeBlock(cp) + '<div class="rep-block"><h3>三项成绩</h3>' + listMetrics(cp) + "</div>" +
        /* 口径基础汇总（票 #39 · D2 复审定稿）：总报告给一段「三项各是什么口径」；
           口径**说明块**只给第一项，第二、三项报告块不加 —— 见 calibNote 的注释。 */
        '<div class="rep-block"><h3>口径基础</h3>' + calibBasis() + "</div>" +
        '<div class="rep-block"><h3>怎么用这份结果</h3><p class="note">测评只产出追问清单，不作录用评分项：同一岗位对所有候选人使用同一套题、同一权重、同一阈值；面试按各档位的追问方向取证，录用决策由简历、专业技能、面谈与工作样本多源证据支撑；测评与面试冲突时以面试与工作样本为主，并记录冲突原因。</p></div>';
    }
    if (id === "m1") {
      return '<div class="rep-block"><h3>第一项 · ' + esc(D.m1.meta.title) + "</h3>" +
        calibNote() +
        /* 四维每行仍是「名 + 分 + 五级胶囊」，**不加迷你梯**：五格并排放不下
           「待提升」（实测折行成两行，390 与 800 宽都难看）—— 按票 #39「别硬塞」。
           第一项**不给总档**（ADR-0010）⇒ 这一块也没有总档五级梯，
           只给四维各档 + 短板维提示（梯留给总报告的综合档与第二项的整体档）。 */
        '<div class="dims">' + R.m1.dims.map((d) => metricRow(d)).join("") + "</div>" +
        '<div class="short-board">短板：<b>' + esc(R.m1.short.name) + "（" + esc(R.m1.short.grade) + "）</b>。第一项只报四维各档，不合成总档；短板指四维里最弱的一维。</div>" +
        '<p class="note">每维 0–24 分，按绝对锚点切档（顶尖 22–24 / 优秀 18–21 / 良好 14–17 / 合格 9–13 / 待提升 0–8）；暂未建立参照分布，后续内部样本到量后校准。</p>' +
        "</div>";
    }
    if (id === "m2") {
      const need = (R.m2.needReview || []);
      return '<div class="rep-block"><h3>第二项 · 情境测试</h3>' +
        '<div class="dims">' + R.m2.dims.map((d) => metricRow(d)).join("") + "</div>" +
        ladderBlock("整体档", R.m2.grade) +
        '<p class="note">加权总分 ' + R.m2.total + " / 5.00。档位：顶尖 ≥4.4 / 优秀 3.8–4.39 / 良好 3.0–3.79 / 合格 2.4–2.99 / 待提升 &lt;2.4。</p>" +
        (need.length ? '<div class="short-board">需复核：<b>' + esc(need.join("、")) + "</b>（自我参照与情境作答差异较大，按『需结合真实经历再确认』处理，不直接采信任一方）。</div>" : "") +
        ((R.m2.consistency && R.m2.consistency.length) ? '<div class="rep-block keep" style="margin-top:var(--sp-4)"><h3>一致性检查</h3><ul class="must">' +
          R.m2.consistency.map((c) => "<li><b>" + esc(c.pair) + "</b>：" + esc(c.status) + "（作答 " + esc(c.detail) + "）</li>").join("") + "</ul>" +
          '<p class="note">一致性检查题不计入任何维度分，只用于观察同一致情境的两种问法是否指向同一倾向；一正一负的按需复核处理。</p></div>' : "") +
        "</div>";
    }
    return '<div class="rep-block"><h3>第三项 · 推理测试</h3>' +
      '<div class="radar-wrap">' + radarSVG(R.m3.dims) + "</div>" +
      /* 维度行同时给三个数：原始分（对 / 总）+ 模型换算（百分位 / T 分）——
         雷达图画的是百分位，这一行给出百分位与 T 分，两个口径就能互相推导（票 #27）。
         只写「对 / 总」时，读者对不上雷达上的数。 */
      '<div class="dims">' + R.m3.dims.map((d) => metricRow(Object.assign({}, d, {
        scoreText: d.correct + " / " + d.total + "　·　P" + d.pct + "　·　T " + d.t, max: 0
      }))).join("") + "</div>" +
      '<p class="note">难度加权答对 ' + R.m3.total + " 分 · 参考分布第 " + R.m3.pct + " 百分位 · T 分 " + R.m3.t +
      "。百分位基于内置参考分布（按题目难度加权的理论模型）换算，不是商业常模，也不等同任何标准化智力测验；T 分超出 100 表示超出模型分布上端（满分作答的正常结果），档位以百分位为准。</p>" +
      /* 「错题回顾」整块去掉（维护者 2026-10-24 裁定：施测人报告只要结果、解析与对候选人的判断；
         逐题解析是给考生自己复盘的，打印出来是 4000+ 字一堵墙 —— 票 #27）。 */
      ((D.m3.must_say && D.m3.must_say.length) ? '<div class="rep-block"><h3>对外反馈时必须说明</h3><ul class="must">' + D.m3.must_say.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul></div>" : "") +
      ((D.m3.must_not_say && D.m3.must_not_say.length) ? '<div class="rep-block"><h3>对外反馈时不得说</h3><ul class="must">' + D.m3.must_not_say.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul></div>" : "") +
      "</div>";
  }

  function reportHTML(R) {
    const cp = R.compose;
    const nav = [['总报告', 'total'], ['第一项', 'm1'], ['第二项', 'm2'], ['第三项', 'm3']];
    const sec = (id) => secHTML(R, id);
    LAST = R;
    const PAGES = [["total", "总报告"], ["m1", "第一项报告"], ["m2", "第二项报告"], ["m3", "第三项报告"]];
    const all = PAGES.map((pg, i) =>
      '<section class="rep-sec' + (pg[0] === "total" ? " on" : "") + '" data-sec="' + pg[0] + '">' +
      '<div class="print-only print-head">报告区块 ' + (i + 1) + " / " + PAGES.length + "： " + esc(pg[1]) +
      " ｜ " + esc(R.name || "") + " ｜ 编号 " + esc(R.code || "") + (R.idLast4 ? " ｜ 末 4 位 " + esc(R.idLast4) : "") + "</div>" +
      secHTML(R, pg[0]) +
      // 区块落款：跨浏览器都能定位到「这是谁的报告、报告第几块」；不依赖固定定位（固定元素会压住正文）
      '<div class="print-only print-end">本区块结束 ｜ 云上文旅集团核心人才系列测试 ｜ 编号 ' + esc(R.code || "") +
      (R.name ? " ｜ " + esc(R.name) : "") + (R.idLast4 ? " ｜ 末 4 位 " + esc(R.idLast4) : "") +
      " ｜ 报告共 " + PAGES.length + " 个区块（每块另起一页）</div></section>").join("");
    return '<div class="wrap" style="max-width:760px">' +
      '<div class="topbar"><div class="wrap" style="padding:0"><div class="toprow"><b>施测人报告</b><span' +
      ">" + esc(R.name || "") +
      " ｜ " + esc(String(R.code || "").slice(0, 12)) + "…" + (R.idLast4 ? " ｜ 末4位 " + esc(R.idLast4) : "") +
      "</span></div></div></div>" +
      '<div class="rep-nav noprint">' + nav.map((n) => '<button data-s="' + n[1] + '" onclick="REP.setSec(this.dataset.s)">' + esc(n[0]) + "</button>").join("") + "</div>" +
      '<div id="rep-body" style="padding-bottom:var(--sp-6)">' + all + "</div>" +
      '<div class="noprint" style="margin:var(--sp-3) 0"><button class="btn btn-primary btn-full" onclick="window.print()">打印 / 存为 PDF</button></div>' +
      '<div class="foot">' + C.foot.map((f) => "<b>" + esc(f) + "</b>").join("") + "</div></div>";
  }

  let LAST = null;
  function setSec(id) {
    if (!LAST) return;
    const btns = document.querySelectorAll(".rep-nav button");
    btns.forEach((b) => b.setAttribute("aria-current", b.dataset.s === id ? "true" : "false"));
    document.querySelectorAll(".rep-sec").forEach((s) => s.classList.toggle("on", s.dataset.sec === id));
    window.scrollTo(0, 0);
  }

  /* setSec 必须导出：报告页的切换按钮写的是 onclick="REP.setSec(...)"
     —— 2026-10-25 修（票 #39 顺带发现的老 bug）：原来没导出，点任何一个区块标签
     都抛 "REP.setSec is not a function"，四个报告块里只有「总报告」能看见。 */
  return { score: score, build: build, reportHTML: reportHTML, setSec: setSec, gradePill: gradePill, bandComposite: bandComposite, ORD: ORD };
})();

</script>
<script>
/* 成品主体：状态、存储、六个屏、三模块作答与计分。结果 JSON 与报告在 report.js。 */
(function () {
  const D = window.__DATA__;
  const C = window.__COPY__;
  const KEY = "assessment_core_v1";
  const OLD_KEYS = ["mbti_draft_v1", "yunshang_test3_draft_v1", "eq_test_draft_v2", "eq_test_done_v2"];
  const app = document.getElementById("app");

  /* ---------------- 工具 ---------------- */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function validId(v) {
    if (!/^\d{17}[\dXx]$/.test(v)) return false;
    const w = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2], c = "10X98765432";
    let s = 0; for (let i = 0; i < 17; i++) s += Number(v[i]) * w[i];
    return c[s % 11] === v[17].toUpperCase();
  }
  function newCode() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    const ds = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
    const cs = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let r = ""; const arr = new Uint32Array(6);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
    else for (let i = 0; i < 6; i++) arr[i] = Math.floor(Math.random() * 4294967296);
    for (let i = 0; i < 6; i++) r += cs[arr[i] % cs.length];
    return "EQ-" + ds + "-" + r + "-" + fnv(r + ds).toString(16).slice(0, 4).toUpperCase().padStart(4, "0");
  }
  function fnv(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0; }
    return h >>> 0;
  }
  const GRADES = ["待提升", "合格", "良好", "优秀", "顶尖"];
  const ORD = { "待提升": 1, "合格": 2, "良好": 3, "优秀": 4, "顶尖": 5 };

  /* ---------------- 状态与存储（只存后 4 位 + 编号，不存全量身份证） ---------------- */
  let S = load();
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (raw && raw.a) {
        /* 兼容旧状态：限时截止时刻（票 #25）是新增字段 */
        if (!raw.deadline) raw.deadline = 0;
        return raw;
      }
    } catch (e) { /* 忽略损坏的本地状态 */ }
    return {
      name: "", idLast4: "", idEcho: "", code: newCode(), consented: false, limit: false,
      a: { m1: [], m2: {}, m3: [] }, cur: { m1: 0, m2: 0, m3: 0 }, mod: "m1", phase: "self", t0: Date.now(),
      deadline: 0
    };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 隐私模式等 */ } }
  function clearOldKeys() { OLD_KEYS.forEach((k) => { try { localStorage.removeItem(k); } catch (e) { } }); }
  function wipe() { try { localStorage.removeItem(KEY); } catch (e) { } clearOldKeys(); S = load(); }

  /* ---------------- 限时：全局一个 90 分钟钟（票 #25 裁定 + 票 #39 修订）----------------
     · 起算点 = 候选人点「同意并开始测试」的那一刻；
     · 截止时刻 deadline 存在本机，断点续答按存的时刻继续走（续答不重新给 90 分钟）；
     · **到点 → 只提示一次，不自动交卷**（票 #39 · D3 · 维护者 2026-10-25 12:34 裁定）：
       候选人可以继续作答，什么时候交卷由他自己决定（走完最后一题即交卷）；
     · **不留任何到点痕迹**（票 #39 · D3 复审定稿）：结果 JSON 与云端提交体里
       既没有用时字段，也没有 limitCut / limitHint —— 到点只是一个提示，不进结果。
     · deadline 只存在本机状态里，不进结果 JSON（不落用时字段）。 */
  const LIMIT_MIN = 90;                    /* 三项合计一个钟（分钟） */
  const LIMIT_WARN_MS = 10 * 60 * 1000;    /* 剩余 10 分钟开始变色 */
  let timerId = null;
  let limitTipped = false;   /* 到点提示只弹一次（票 #39 · D3 复审定稿） */

  function startTimer() {
    stopTimer();
    if (!S.limit) return;
    if (!S.deadline) { S.deadline = Date.now() + LIMIT_MIN * 60000; save(); }
    tickTimer();
    timerId = setInterval(tickTimer, 1000);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function tickTimer() {
    const el = document.getElementById("t-left");
    if (!el) return;
    const left = S.deadline - Date.now();
    if (left <= 0) {
      /* 到点：停钟 + 顶栏改成「限时已到」（不再倒计时）+ 提示一次。**不跳完成页。** */
      stopTimer();
      el.textContent = C.limitHitLeftLabel;
      el.style.opacity = "1";
      el.style.color = "var(--gold)";
      el.style.fontWeight = "700";
      onLimitHit();
      return;
    }
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    el.textContent = C.limitLeftLabel + " " + m + ":" + String(s).padStart(2, "0");
    /* 剩余 10 分钟内转金色提醒：金在深绿底 4.55:1 ✓（tokens.css 坑 1 (b)）。
       .toprow span 默认 opacity:.92（分组透明度），故提醒态须同时把 opacity 拉回 1，
       否则对比度会被压到 4.5:1 以下。#t-left 是 .toprow 的直接子元素，改它自身即可。 */
    const warn = left < LIMIT_WARN_MS;
    el.style.opacity = warn ? "1" : "";
    el.style.color = warn ? "var(--gold)" : "";
    el.style.fontWeight = warn ? "700" : "";
  }
  function onLimitHit() {
    /* 票 #39 · D3（维护者 2026-10-25 复审定稿）：到点**只提示一次、不自动交卷、不留痕**。
       这里不再有任何跳完成页的逻辑 —— 交卷只由候选人自己走完最后一题触发（APP.next → done）。
       也不写任何到点痕迹：结果里既没有用时字段，也没有 limitCut / limitHint。 */
    if (limitTipped) return;                 /* 只提示一次 */
    limitTipped = true;
    showLimitTip();
  }
  function showLimitTip() {
    const w = document.getElementById("warn");
    if (w) { w.hidden = false; w.textContent = C.limitHitTip; }
  }

  /* ---------------- 五级切档 ---------------- */
  function bandM1(score, dim) {
    const b = D.m1.meta.bands;
    for (const k of ["顶尖", "优秀", "良好", "合格"]) if (score >= b[k][0] && score <= b[k][1]) return k;
    return "待提升";
  }
  function bandWeighted(v) { return v >= 4.4 ? "顶尖" : v >= 3.8 ? "优秀" : v >= 3.0 ? "良好" : v >= 2.4 ? "合格" : "待提升"; }
  function bandT(t) { return t >= 63 ? "顶尖" : t >= 55 ? "优秀" : t >= 48 ? "良好" : t >= 42 ? "合格" : "待提升"; }
  function bandComposite(v) { return v >= 4.5 ? "顶尖" : v >= 3.75 ? "优秀" : v >= 3.0 ? "良好" : v >= 2.25 ? "合格" : "待提升"; }

  /* ---------------- 三模块的题目序列 ---------------- */
  const MODULES = [
    { key: "m1", no: "第一项", name: D.m1.meta.title, count: D.m1.meta.dimensions.reduce((n, d) => n + d.items, 0) + " 题", min: "约 12 分钟" },
    { key: "m2", no: "第二项", name: "情境测试", count: "16 自评 + 60 情境", min: "约 30 分钟" },
    { key: "m3", no: "第三项", name: "推理测试", count: "40 题 · 8 维度", min: "建议 45 分钟" }
  ];
  function m2List() {
    const self = D.eq.self_items.map((x) => ({ kind: "self", id: x.id, text: x.text, dim: x.dimension, rev: !!x.reverse }));
    /* 选项字段两个名字都认：build.py 把第二项的 options 由 {A,B,C,D} 转成了数组 opts，
       而第三项的题库里字段就叫 options。2026-10-25 修（真实候选人反馈「第二项第 17 题没有选项」）：
       这里原来只读 x.options ⇒ 取到 undefined ⇒ 渲染时 q.opts || q.options 两边都是空
       ⇒ **60 道情境题一题选项都不渲染**（自评 16 题走七级量表分支，所以卡在第 17 题才暴露）。 */
    const sjt = D.eq.sjt.map((x) => ({ kind: "sjt", id: x.id, stem: x.stem, opts: x.opts || x.options || [], dim: x.dimension, ans: x.answer, sec: x.second, thd: x.third }));
    return self.concat(sjt);
  }
  const M2ALL = m2List();
  const M3ALL = D.m3.questions;

  function totalOf(mk) {
    if (mk === "m1") return D.m1.items.length;
    if (mk === "m2") return M2ALL.length;
    return M3ALL.length;
  }
  function answeredOf(mk) {
    if (mk === "m1") return S.a.m1.filter((x) => x !== null && x !== undefined).length;
    if (mk === "m2") return Object.keys(S.a.m2).length;
    return Object.keys(S.a.m3).length;
  }
  function curItem(mk) {
    if (mk === "m1") return { kind: "ab", i: S.cur.m1 };
    if (mk === "m2") { const it = M2ALL[S.cur.m2]; return it ? { kind: it.kind, i: S.cur.m2 } : null; }
    return { kind: "mc", i: S.cur.m3 };
  }
  function pickOf(mk, i) {
    if (mk === "m1") return S.a.m1[i];
    if (mk === "m2") return S.a.m2[i];
    return S.a.m3[i];
  }
  function setPick(mk, i, v) {
    if (mk === "m1") S.a.m1[i] = v;
    else if (mk === "m2") S.a.m2[i] = v;
    else S.a.m3[i] = v;
    save();
  }

  /* ---------------- 渲染：开始页 ---------------- */
  function startHTML() {
    const idLine = S.idLast4
      ? '<span class="hint">已记录末 4 位 <b>' + esc(S.idLast4) + '</b>（其余不留存）· 本机回显 ' + esc(S.idEcho) + '</span>'
      : "";
    const fields =
      '<label class="field"><span>姓名</span><input id="f-name" autocomplete="off" placeholder="请输入真实姓名" value="' + esc(S.name) + '"></label>' +
      '<label class="field"><span>身份证号码（18 位）</span><input id="f-id" autocomplete="off" inputmode="numeric" maxlength="18" placeholder="请输入 18 位身份证号码" value="">' +
      idLine + '<span class="hint">仅用于身份核对与防重复提交：在本机校验后立即丢弃，只保留末 4 位，不随结果回传。</span></label>';
    const tasks = '<ul class="tasklist">' + MODULES.map((m) =>
      '<li><span class="mk">' + m.no.replace("第", "") + '</span><span class="tt">' + esc(m.name) + '<em>' + esc(m.count) + '</em></span><span class="pc">' + esc(m.min) + '</span></li>'
    ).join("") + '</ul>';
    const limit = '<label class="check"><input type="checkbox" id="f-limit" ' + (S.limit ? "checked" : "") + '><span>' + esc(C.limitLabel) + '</span></label>';
    const resume = (answeredOf("m1") || answeredOf("m2") || answeredOf("m3"))
      ? '<div class="panel" style="margin-top:var(--sp-3)"><h3>检测到未完成的作答</h3>' +
        '<p class="hint" style="margin:0">「' + esc(D.brand || "云上文旅集团核心人才系列测试") + '」上次做到 <b>' + esc(curLabel()) + '</b>。</p>' +
        '<button class="btn btn-ghost" style="margin-top:var(--sp-2)" onclick="APP.go(\'quiz\')">继续上次答题</button></div>'
      : "";
    return '<div class="wrap"><div class="sheet" style="margin-top:var(--sp-4)">' +
      '<div class="brand"><h1>' + esc(D.brand) + '</h1><div class="rule"></div></div>' +
      '<div class="sect-title">测评人信息</div>' + fields +
      '<div class="sect-title">本次包含</div>' + tasks +
      '<div class="sect-title">作答方式</div>' + limit +
      '<button class="btn btn-primary btn-full" style="margin-top:var(--sp-4)" onclick="APP.toConsent()">' + esc(C.startBtn) + '</button>' +
      resume +
      '<p class="hint" style="text-align:center;margin-top:var(--sp-3)">已有施测人？<a href="javascript:APP.go(\'hr\')">从施测人入口进入</a></p>' +
      '</div>' + footHTML() + '</div>';
  }
  function curLabel() {
    const it = curItem(S.mod);
    if (!it) return "完成页";
    if (S.mod === "m1") return "第一项 第 " + (it.i + 1) + " 题";
    if (S.mod === "m2") return "第二项 第 " + (it.i + 1) + " 题";
    return "第三项 第 " + (it.i + 1) + " 题";
  }

  /* ---------------- 渲染：告知卡 ---------------- */
  function consentHTML() {
    const first = MODULES[0].name + "（" + MODULES[0].count + "）";
    const terms = C.terms.map((t) => "<p><b>" + esc(t[0]) + "</b>" + esc(t[1].replace("{FIRST}", first)) + "</p>").join("");
    /* 勾了限时才给这段说明（告知卡要素清单把「限时模式开关说明」列为可选要素）；
       里面写的每一条都必须与实现对得上 —— 禁止本页做不到的表述。 */
    const limitBlock = S.limit
      ? '<div class="panel" style="margin:var(--sp-3) 0"><h3>' + esc(C.limitTermsTitle) + '</h3><div class="terms">' +
        C.limitTerms.map((t) => "<p>" + esc(t) + "</p>").join("") + "</div></div>"
      : "";
    return '<div class="wrap"><div class="sheet consent" style="margin-top:var(--sp-4);padding:var(--sp-5) var(--sp-4)">' +
      "<h2>本次测试的知情同意</h2>" +
      '<p class="hint" style="margin:var(--sp-1) 0 var(--sp-3)">下面这段说明这次测评是什么、结果谁会看到、怎么使用。请逐条阅读，勾选下方确认框后再开始。</p>' +
      '<div class="terms">' + terms + "</div>" +
      limitBlock +
      '<div style="border-top:1px solid var(--line);padding-top:var(--sp-3)">' +
      '<label class="check"><input type="checkbox" id="c-box" onchange="document.getElementById(\'c-ok\').disabled=!this.checked"><span>我已阅读并理解以上八条说明，<b>自愿参加</b>本次测试。</span></label>' +
      '<div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-3)">' +
      '<button class="btn btn-primary" id="c-ok" style="flex:2" disabled onclick="APP.toQuiz()">' + esc(C.agreeBtn) + "</button>" +
      '<button class="btn btn-quiet" style="flex:1" onclick="APP.go(\'start\')">' + esc(C.quitBtn) + "</button>" +
      "</div></div></div>" + footHTML() + "</div>";
  }

  /* ---------------- 渲染：答题页 ---------------- */
  function quizHTML() {
    const mk = S.mod, it = curItem(mk);
    if (!it) return doneHTML();
    const total = totalOf(mk), done = answeredOf(mk);
    const pct = Math.round(done / total * 100);
    const mod = MODULES.find((m) => m.key === mk);
    const bar = '<div class="pbar"><i style="width:' + pct + '%"></i></div>';
    /* 限时中：题头显示**真实剩余时间**（票 #25）。原来这里只有「· 限时中」三个字，
       全文件没有任何计时行为 —— 那是一句做不到的承诺。 */
    /* 限时模式下顶栏分两行：第一行「模块名 + 剩余时间」，第二行「第 x / N 题 · 已答 y」。
       倒计时与模块名挤在一行会在 390 CSS px 下换行（顶栏涨到三行），已实测。 */
    const prog = '<span id="tmeta">第 ' + (it.i + 1) + " / " + total + " 题 · 已答 " + done + "</span>";
    const meta = S.limit
      ? '<div class="toprow"><b>' + esc(mod.no + " · " + mod.name) + '</b><span id="t-left">' + esc(C.limitLeftLabel) + " --:--</span></div>" +
        '<div class="toprow">' + prog + "</div>"
      : '<div class="toprow"><b>' + esc(mod.no + " · " + mod.name) + "</b>" + prog + "</div>";
    let body = "";
    if (it.kind === "ab") {
      const q = D.m1.items[it.i];
      body = '<div class="qstem">' + esc("以下哪种描述更符合你？") + "</div>" +
        '<div class="opts">' + [q.a, q.b].map((o, k) =>
          '<button class="opt" type="button" aria-pressed="' + (pickOf(mk, it.i) === k ? "true" : "false") + '" data-i="' + k + '" onclick="APP.pick(this)">' +
          '<span class="k">' + "AB"[k] + "</span><span>" + esc(o) + "</span></button>").join("") + "</div>";
    } else if (it.kind === "self") {
      const q = M2ALL[it.i];
      body = '<div class="qstem">' + esc(q.text) + "</div>" +
        '<div class="scale" role="group" aria-label="七级量表">' +
        ["非常不符合", "", "", "不确定", "", "", "非常符合"].map((lab, k) =>
          '<button class="seg" type="button" aria-pressed="' + (pickOf(mk, it.i) === k + 1 ? "true" : "false") + '" data-i="' + k + '" aria-label="第 ' + (k + 1) + ' 级 ' + (lab || "中间等级") + '" onclick="APP.pick(this)">' +
          '<span class="dot"></span><span class="sl">' + (lab || "") + "</span></button>").join("") + "</div>";
    } else {
      const q = mk === "m2" ? M2ALL[it.i] : M3ALL[it.i];
      /* 选项字段两个名字都认：第二项的题在 build.py 里转成了 opts，
         第三项的题库里字段就叫 options。2026-10-25 修（票 #39 顺带发现的老 bug）：
         这里原来只读 q.opts，第三项一渲染就抛 TypeError —— 候选人卡在第二项末尾，
         整卷交不出去（连带「手动交卷」流程根本走不到）。 */
      const opts = q.opts || q.options || [];
      const grid = q.grid ? '<pre class="grid" style="font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-3);line-height:1.5;margin-bottom:var(--sp-3)">' +
        esc(Array.isArray(q.grid) ? q.grid.join("\n") : q.grid) + "</pre>" : "";
      body = '<div class="qstem">' + esc(q.stem) + "</div>" + grid +
        '<div class="opts" role="group" aria-label="选项">' + opts.map((o, k) =>
          '<button class="opt" type="button" aria-pressed="' + (pickOf(mk, it.i) === k ? "true" : "false") + '" data-i="' + k + '" onclick="APP.pick(this)">' +
          '<span class="k">' + "ABCD"[k] + "</span><span>" + esc(o) + "</span></button>").join("") + "</div>";
    }
    const warn = '<div class="warn" id="warn" role="status" aria-live="polite" hidden>' + esc(C.warnUnanswered) + "</div>";
    const nav = '<div class="qnav">' +
      '<button class="btn btn-quiet" onclick="APP.prev()">上一题</button>' +
      '<button class="btn btn-primary" id="next" ' + (pickOf(mk, it.i) === null || pickOf(mk, it.i) === undefined ? "disabled" : "") + " onclick=\"APP.next()\">下一题</button></div>" +
      '<button class="btn btn-quiet btn-full" style="margin-top:var(--sp-2)" onclick="APP.openGrid()">题号 · 已答 ' + done + " / " + total + "</button>" +
      '<p class="hint" style="margin-top:var(--sp-2)">进度自动保存在本机，中途关闭可继续。</p>';
    return '<div class="topbar"><div class="wrap"><div class="in">' + meta + "</div>" + bar + "</div></div>" +
      '<div class="wrap"><div class="qbody">' + body + warn + nav + "</div></div>" + footHTML();
  }

  /* ---------------- 渲染：完成页 ----------------
     票 #39：候选人在自助云版里**看不到自己的结果** ⇒ 这一页只说
     「已完成 · 结果由 HR 保管」，不出现分数、等级与任何评价结论（旧图红线 6 仍然有效）。
     撤回通道做成可选：提一句「如需删除本次记录，请联系 HR」。 */
  function doneHTML() {
    /* 完成页（票 #39 · D6 · 维护者 2026-10-25 裁定与复审定稿）：
       只显示「已完成 · 结果由 HR 保管」，**不出现分数、等级与任何评价结论**（旧图红线 6 仍然有效）。
       离线版的「下载结果文件 + 回传给施测人」整套话术与入口一并撤掉（云版直接落库，没有回传动作）；
       候选人侧的「清除本机」入口也一并撤掉（本机残留由候选人自行清浏览器数据）。
       撤回通道做成可选：这里只留一句「如需删除本次记录，请联系集团人力资源部」。
       **云上测试版的两处例外**：上传状态行与「下载结果文件」兜底按钮只在云上版出现
       （build.py --cloud）—— 上传失败时作答需要一条能带走的出口；离线版严格按 D6，两样都没有。 */
    return '<div class="wrap"><div class="sheet" style="margin-top:var(--sp-4);padding:var(--sp-6) var(--sp-4)">' +
      '<div class="done-seal">✓</div>' +
      '<h2 style="font-size:var(--fs-6);text-align:center">' + esc(C.doneTitle) + "</h2>" +
      '<p class="hint" style="max-width:330px;margin:var(--sp-2) auto 0;text-align:center">' + esc(C.doneLead) + "</p>" +
      (CLOUD.enabled ? '<p class="hint" id="cloud-state" style="max-width:330px;margin:var(--sp-1) auto 0;text-align:center">正在提交本次作答…</p>' : "") +
      '<p class="hint" style="max-width:330px;margin:var(--sp-1) auto 0;text-align:center">' + esc(C.doneWithdraw) + "</p>" +
      /* 兜底出口只在云上测试版出现（上传失败时作答要能被带走）；离线版严格按 D6，没有这个入口 */
      (CLOUD.enabled ? '<button class="btn btn-primary btn-full" style="margin-top:var(--sp-3)" onclick="APP.download()">下载结果文件（JSON）</button>' : "") +
      '<button class="btn btn-quiet btn-full" style="margin-top:var(--sp-2)" onclick="APP.reset()">再测一次</button>' +
      "</div>" + footHTML() + "</div>";
  }

  /* ---------------- 渲染：施测人入口 ---------------- */
  function hrHTML() {
    return '<div class="wrap"><div class="sheet" style="margin-top:var(--sp-4);padding:var(--sp-5) var(--sp-4)">' +
      '<div class="sect-title">施测人入口</div>' +
      '<p class="hint">' + esc(C.hrLead) + "</p>" +
      '<label class="field" style="margin-top:var(--sp-3)"><span>测评编号</span><input id="hr-code" value="' + esc(S.code) + '"></label>' +
      '<label class="field"><span>或粘贴结果 JSON</span><textarea id="hr-json" style="width:100%;min-height:110px;border:1px solid var(--line);border-radius:var(--r-m);padding:var(--sp-2);font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-2)" placeholder="{\\"tool\\": \\"…\\"}"></textarea></label>' +
      '<button class="btn btn-primary btn-full" onclick="APP.openReport()">导入结果并查看报告</button>' +
      '<p class="hint" style="margin-top:var(--sp-2)">（本页面纯前端处理，不上传任何数据。）</p>' +
      "</div>" + footHTML() + "</div>";
  }

  /* ---------------- 云端上报（云上版 · 票 #33 / #40）----------------
     离线版：false = false —— 不联网，页脚与完成页保持「只在本机」口径。
     云上版：src/build.py --cloud 会把 false 置为 true、 填成网关路由地址；
     交卷时把作答 POST 给云函数，由云函数落 CloudBase PG（候选人浏览器**不碰数据库**：
     网关的 PG 连接带 row_security=off，浏览器角色写不进开了 RLS 的表）。
     上报失败不阻断：候选人仍可下载结果文件回传（离线兜底）。 */
  const CLOUD = { enabled: false, endpoint: "" };

  function cloudPayload() {
    const r = window.REP.score(S);
    const m1 = (S.a.m1 || []).map(function (v) { return (v === null || v === undefined) ? -1 : v; });
    return {
      code: S.code,
      respondent_name: S.name,
      id_last4: S.idLast4,
      started_at: new Date(S.t0).toISOString(),
      submitted_at: new Date().toISOString(),
      duration_ms: Math.max(0, Date.now() - S.t0),
      m1_raw: m1,                 /* 96 题逐题作答：0=选 a 侧 / 1=选 b 侧（-1=未作答） */
      m1_scores: r.m1.out,        /* 四维分与档位快照（客户端算分的口径） */
      m2_result: r.m2.out,
      m3_result: r.m3.out,
      unanswered_m1: m1.filter(function (v) { return v === -1; }).length
    };
  }
  function cloudKick() {
    if (!CLOUD.enabled) return;
    const el = document.getElementById("cloud-state");
    fetch(CLOUD.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cloudPayload())
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (!el) return;
        el.textContent = (res && res.ok)
          ? "已提交到集团人力资源部的系统（结果不在本页面显示）。"
          : "本次未能联网上传，请下载结果文件回传给施测人。";
      })
      .catch(function () {
        if (!el) return;
        el.textContent = "本次未能联网上传，请下载结果文件回传给施测人。";
      });
  }
  function footHTML() {
    const lines = (CLOUD.enabled && C.footCloud) ? C.footCloud : C.foot;
    return '<div class="foot">' + lines.map(function (f) { return "<b>" + esc(f) + "</b>"; }).join("") + "</div>";
  }

  /* ---------------- 屏幕切换 ---------------- */
  const SCREENS = { start: startHTML, consent: consentHTML, quiz: quizHTML, done: doneHTML, hr: hrHTML };
  let REPORT = null;
  function render() {
    app.innerHTML = SCREENS[S.screen] ? SCREENS[S.screen]() : (REPORT ? window.REP.reportHTML(REPORT) : startHTML());
    if (S.screen === "quiz") drawGrid();
    /* 计时器只在答题屏跑；离开答题屏立即停（施测人入口/报告页不该有钟） */
    if (S.screen === "quiz") startTimer(); else stopTimer();
    window.scrollTo(0, 0);
  }
  function go(s) { S.screen = s; render(); }

  /* ---------------- 交互 ---------------- */
  function toConsent() {
    const n = document.getElementById("f-name"), i = document.getElementById("f-id");
    const l = document.getElementById("f-limit");
    if (n) S.name = n.value.trim();
    if (l) {
      S.limit = l.checked;
      /* 取消勾选 = 取消限时：清掉截止时刻与到点痕迹，避免上一轮残留把这一轮也标上 */
      if (!S.limit) { S.deadline = 0; }
    }
    if (i && i.value.trim()) {
      if (!validId(i.value.trim())) { alert("身份证号格式或校验位不对，请核对后重填"); return; }
      const v = i.value.trim();
      S.idLast4 = v.slice(-4); S.idEcho = v.slice(0, 6) + "********" + v.slice(-4); i.value = "";
    }
    if (!S.name) { alert("请先填写姓名"); return; }
    save(); go("consent");
  }
  function toQuiz() {
    const b = document.getElementById("c-box");
    if (b) S.consented = b.checked;
    if (!S.consented) { alert("请先勾选同意"); return; }
    /* 限时起算点 = 候选人点「同意并开始测试」这一刻（票 #25 裁定） */
    if (S.limit && !S.deadline) S.deadline = Date.now() + LIMIT_MIN * 60000;
    S.mod = "m1"; S.phase = "self"; save(); go("quiz");
  }
  function pick(el) {
    const it = curItem(S.mod);
    let v = Number(el.dataset.i);
    if (it.kind === "self") v = v + 1;
    setPick(S.mod, it.i, v);
    document.querySelectorAll(".opt,.seg").forEach((o) => o.setAttribute("aria-pressed", "false"));
    el.setAttribute("aria-pressed", "true");
    const n = document.getElementById("next"); if (n) n.disabled = false;
    const w = document.getElementById("warn"); if (w) w.hidden = true;
  }
  function next() {
    const it = curItem(S.mod);
    const p = pickOf(S.mod, it.i);
    if (p === null || p === undefined) {
      const w = document.getElementById("warn");
      if (w) { w.hidden = false; w.textContent = C.warnUnanswered; }
      return;
    }
    const total = totalOf(S.mod);
    if (it.i + 1 >= total) {
      if (S.mod === "m1") { S.mod = "m2"; S.cur.m2 = 0; }
      else if (S.mod === "m2") { S.mod = "m3"; S.cur.m3 = 0; }
      else { S.screen = "done"; cloudKick(); }
      save(); render(); return;
    }
    S.cur[S.mod] = it.i + 1; save(); render();
  }
  function prev() {
    const it = curItem(S.mod);
    if (it.i <= 0) return;
    S.cur[S.mod] = it.i - 1; save(); render();
  }
  function openGrid() {
    const p = document.getElementById("gridpanel"), m = document.getElementById("mask");
    if (p) p.classList.add("on"); if (m) m.classList.add("on");
  }
  function closeGrid() {
    const p = document.getElementById("gridpanel"), m = document.getElementById("mask");
    if (p) p.classList.remove("on"); if (m) m.classList.remove("on");
  }
  function drawGrid() {
    const g = document.getElementById("grid"); if (!g) return;
    const total = totalOf(S.mod), it = curItem(S.mod);
    g.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const b = document.createElement("b");
      b.textContent = i + 1;
      const p = pickOf(S.mod, i);
      if (p !== null && p !== undefined) b.className = "done";
      if (it && i === it.i) b.className = "cur";
      b.onclick = () => {
        if (p === null || p === undefined) { alert(C.warnJump.replace("N", i + 1)); return; }
        S.cur[S.mod] = i; save(); render();
      };
      g.appendChild(b);
    }
  }

  /* ---------------- 结果 JSON 与清除 ---------------- */
  function resultObj() {
    const r = window.REP.score(S);
    const out = {
      tool: D.brand, version: "20261024", code: S.code, name: S.name, idLast4: S.idLast4,
      date: new Date().toISOString(), m1: r.m1.out, m2: r.m2.out, m3: r.m3.out
    };
    /* 结果里不落任何用时字段，也不落到点痕迹（票 #39 · D3 复审定稿：到点只提示、不留痕）。
       字段恒为 9 个：tool / version / code / name / idLast4 / date / m1 / m2 / m3。 */
    return out;
  }
  function download() {
    const blob = new Blob([JSON.stringify(resultObj(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "核心人才系列测试_" + (S.name || "result") + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  }
  function clearAll() {
    if (!confirm("确定清除本机缓存的作答与结果？清除后无法恢复。")) return;
    wipe(); closeGrid(); alert(C.clearDoneTip); go("start");
  }
  function reset() {
    if (!confirm("重新开始？本次记录会被清空。")) return;
    const code = S.code; wipe(); S.code = code; go("start");
  }

  /* ---------------- 施测人：导入结果 → 报告 ---------------- */
  function openReport() {
    const t = document.getElementById("hr-json");
    let data = null;
    if (t && t.value.trim()) {
      try { data = JSON.parse(t.value); } catch (e) { alert("结果 JSON 解析失败，请检查粘贴内容"); return; }
    } else {
      data = resultObj(); // 施测人本地直接生成（用于演示与自检）
    }
    try { REPORT = window.REP.build(data); } catch (e) { alert("报告生成失败：" + e.message); return; }
    S.screen = "report"; render();
  }

  /* ---------------- 启动 ---------------- */
  window.APP = { go, toConsent, toQuiz, pick, next, prev, openGrid, closeGrid, download, clearAll, reset, openReport, save, S: () => S };
  clearOldKeys();
  if (!S.a || !S.a.m1) S = load();
  render();
})();

</script>

<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    var p = new URLSearchParams(location.search);
    var scr = p.get('qa') || 'start';
    try{
      if(scr==='quiz'||scr==='done'||scr==='report'){
        var S = APP.S();
        S.name='演示候选人'; S.idLast4='4821'; S.idEcho='330106********4821'; S.consented=true;
        if(scr==='report'){
          var D=window.__DATA__, sc=window.REP.score;
          for(var i=0;i<D.m1.items.length;i++){ S.a.m1[i]= D.m1.items[i].anchor==='a'?0:1; }
          D.eq.self_items.forEach(function(x,ix){ S.a.m2[ix]=4; });
          var off=D.eq.self_items.length;
          D.eq.sjt.forEach(function(q,ix){ var L='ABCD'; var k=L.indexOf(q.answer); S.a.m2[off+ix]= k<0?0:k; });
          D.m3.questions.forEach(function(q,ix){ S.a.m3[ix]= q.answer; });
          APP.openReport();
        } else { APP.go(scr); }
      } else { APP.go(scr); }
    }catch(e){ document.title='QAERR: '+e.message; }
  }, 120);
});
</script>
</body>
</html>
